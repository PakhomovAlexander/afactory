schema = "af.worker/1"
name = "development/python"
version = "1.0.0"

[signature]
effects = ["read-source", "execute-checks"]
roles = ["review"]
worker_input_type = "af/ImplementationInput@1"
worker_output_type = "af/ImplementationReport@1"

[signature.contract.inputs.source]
artifact_type = "af/SourceTree@1"
cardinality = "one"
optional = false
covers = []
[signature.contract.inputs.source.affinity]
kind = "unbound"

[signature.contract.outputs.report]
artifact_type = "af/ImplementationReport@1"
cardinality = "one"
optional = false
covers = []
[signature.contract.outputs.report.affinity]
kind = "same_as"
input = "source"

[signature.evidence]
[signature.retains]
report = ["source"]


[signature.attempt]
tokens = 0
wall_ms = 120000

[runner]
kind = "command"
[runner.command]
program = "@tool/sh"
args = [{ value = "@package/harness.sh", provenance = "literal" }]
