schema = "af.worker-development/3"
harness = "sh"
binding_identity = "@BINDING_ID@"
writable_roots = ["source", "state", "scratch", "build", "cache"]
state = "attempt_private"
cache = "attempt_private"
knowledge = "disabled"
dependencies = "available_only"
network = "deny"

[tools]
sh = "@SH_ID@"
cargo = "@CARGO_ID@"
rustc = "@RUSTC_ID@"
cc = "@CC_ID@"

[environment]
CARGO_HOME = "${cache}/cargo"
CARGO_TARGET_DIR = "${build}"
CARGO_NET_OFFLINE = "true"
RUSTUP_HOME = "${dependencies}/rustup"
RUSTUP_AUTO_INSTALL = "0"

[limits]
wall_ms = 120000
output_bytes = 65536
cpu_millicores = 2000
memory_bytes = 1073741824
processes = 128
disk_bytes = 268435456

[caches.objects]
role = "build"
destination = "build"
path = ""
selection = "compatible"
persistence = "admitted_output"
lifecycle = "task"
fingerprints = ["Cargo.lock", "Cargo.toml"]
keys = { profile = "test", flags = "offline-locked", features = "default" }
input = "cache_in"
output = "cache_out"
[caches.objects.limits]
max_bytes = 268435456
max_entries = 16384
max_depth = 32
max_path_bytes = 4096
