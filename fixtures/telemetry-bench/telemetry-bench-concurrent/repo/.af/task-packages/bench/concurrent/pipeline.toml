schema = "af.pipeline/1"
name = "bench/concurrent"
version = "1.0.0"
max_attempts = 8
max_parallel = 4

[contract.inputs.history]
artifact_type = "af/ReviewHistory@1"
cardinality = "one"
optional = false
root_default = "empty_review_history"
covers = []

[contract.inputs.history.affinity]
kind = "unbound"

[contract.inputs.source]
artifact_type = "af/SourceTree@1"
cardinality = "one"
optional = false
covers = []

[contract.inputs.source.affinity]
kind = "unbound"

[contract.inputs.requirements]
artifact_type = "af/Requirements@1"
cardinality = "one"
optional = true
covers = []

[contract.inputs.requirements.affinity]
kind = "unbound"

[contract.outputs.history]
artifact_type = "af/ReviewHistory@1"
cardinality = "one"
optional = false
covers = []

[contract.outputs.history.affinity]
kind = "unbound"

[contract.outputs.review]
artifact_type = "af/TaskReviewRound@1"
cardinality = "one"
optional = false
covers = ["reviewed"]

[contract.outputs.review.affinity]
kind = "same_as"
input = "source"

[accepts]
kinds = ["review"]

[accepts.required_facts]

[slots.alpha]
worker = "bench/alpha"
role = "review"
input_type = "af/ReviewInput@1"
output_type = "review.kernel/ReviewerResult@2"
min_attempts = 1
max_attempts = 1
allow_local_replacement = false
independent_from = []

[slots.beta]
worker = "bench/beta"
role = "review"
input_type = "af/ReviewInput@1"
output_type = "review.kernel/ReviewerResult@2"
min_attempts = 1
max_attempts = 1
allow_local_replacement = false
independent_from = []

[slots.gamma]
worker = "bench/gamma"
role = "review"
input_type = "af/ReviewInput@1"
output_type = "review.kernel/ReviewerResult@2"
min_attempts = 1
max_attempts = 1
allow_local_replacement = false
independent_from = []

[slots.delta]
worker = "bench/delta"
role = "review"
input_type = "af/ReviewInput@1"
output_type = "review.kernel/ReviewerResult@2"
min_attempts = 1
max_attempts = 1
allow_local_replacement = false
independent_from = []

