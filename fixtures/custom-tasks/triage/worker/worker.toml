[signature.contract.inputs.issue]
artifact_type = "custom/Issue@1"
cardinality = "one"
optional = false
covers = []
[signature.contract.inputs.issue.affinity]
kind = "unbound"

[signature.contract.outputs.triage]
artifact_type = "custom/IssueTriage@2"
cardinality = "one"
optional = false
covers = []
[signature.contract.outputs.triage.affinity]
kind = "unbound"
