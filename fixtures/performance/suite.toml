# Its seed writes 10,000 events through the protected writer, one FULL-synchronous transaction
# each (about 25 s on a local macOS host), once per side and shard; each sample copies it.
sample_timeout_seconds = 120
budgets = []
probe = { contract_id = "state_projection_v2", repetitions = 1, seed = { case_id = "state_projection_seed", contract_id = "state_projection_seed_v1", parameters = ["log"], description = "The fixture Task's log of exactly 10,000 valid relevant events, written once per side and shard through the side's own protected public writer; each sample projects its private copy through a fresh Store." } }

