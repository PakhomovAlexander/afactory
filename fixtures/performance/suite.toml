cache = { process = "fresh", store = "fresh", projection = "by_parameter", os_page_cache = "warm" }
oracle = { kind = "golden_semantic_projection", state = "available", description = "Committed projection digest and counts." }
execution = { state = "supported", pending = "" }
parameters = { log = { kind = "fixture", values = ["events_10000"] }, projection = { kind = "enum", values = ["application_cold", "prewarmed"] } }
tiers = ["quick", "nightly"]
