# Tiers: the first profile is the default; a manual run may select another. ------------------

[tiers.quick]
description = "Pull requests and main pushes."
profiles = [{ environment = "linux_x86_64_gnu_hosted", recipe = "linux_gnu_native_release" }]
# Spread the full suite over sixteen schedules, four at a time. Long authority workloads
# may use 25 sampling minutes within the same 60-minute total limit (ADR-0193).
# These defaults stay below the unchanged hard maxima of eight jobs and 30 minutes per shard.
shards = 16
concurrent_jobs = 4
shard_sampling_minutes = 25
run_total_minutes = 60

[tiers.nightly]
description = "Frozen main against the highest reachable stable release."
profiles = [
  { environment = "linux_x86_64_musl_hosted", recipe = "linux_musl_shipping" },
  { environment = "macos_arm64_local", recipe = "macos_arm64_native_release" },
]
shards = 4
concurrent_jobs = 4
shard_sampling_minutes = 45
run_total_minutes = 120

[tiers.release]
description = "A published release against its predecessor; advisory for publication."
profiles = [
  { environment = "linux_x86_64_musl_hosted", recipe = "linux_musl_shipping" },
  { environment = "macos_arm64_local", recipe = "macos_arm64_native_release" },
]
shards = 4
concurrent_jobs = 4
shard_sampling_minutes = 45
run_total_minutes = 120

# Cases ---------------------------------------------------------------------------------------

[cases.cli_discovery]
family = "cli_discovery"
description = "Launch the actual AF binary for one discovery command; whole process."
kind = "process"
requires_linux_containment = false
timing = { boundary = "child_process_lifetime", description = "Supervisor clock from child launch to observed child exit." }
cache = { process = "fresh", store = "not_applicable", projection = "not_applicable", os_page_cache = "warm" }
oracle = { kind = "cli_version_and_usage_tokens", state = "available", description = "The side's own package version or command-specific usage tokens (cli.toml); empty output fails." }
execution = { state = "supported", pending = "" }
parameters = { command = { kind = "enum", values = ["version", "help", "task_help", "review_run_help"] } }
tiers = ["quick", "nightly", "release"]
criticality = "critical"
primary_metric = "wall_ms"
optional_metrics = ["user_cpu_ms", "system_cpu_ms", "context_switches", "page_faults", "cgroup_peak_memory_bytes", "wait4_maxrss_bytes"]
policy = "wall_time_default"
pairs = { quick = 40, nightly = 40, release = 40 }
warmup_pairs = 2
sample_timeout_seconds = 30
budgets = ["cli_discovery_under_50ms"]

