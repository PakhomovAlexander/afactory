os = "linux"
target = "x86_64-unknown-linux-gnu"
toolchain = "1.88.0"
profile = "release"
builder = "cargo"
linker = "system_cc"
features = []
rustflags = []
instrumented = false
debug_symbols = false
frame_pointers = false
state = "not_yet_executable"
