# Environments --------------------------------------------------------------------------------

[environments.linux_x86_64_gnu_hosted]
description = "Hosted Linux x86_64 GNU for quick comparisons; affinity never claims exclusive CPUs."
os = "linux"
arch = "x86_64"
libc = "gnu"
runner = "github_hosted"
runner_label = "ubuntu-latest"
containment = "linux_container"
logical_cpus = 2
prefer_separate_physical_cores = true
memory_limit_bytes = 4294967296
pid_limit = 256
swap = "disabled"
network = "disabled"
cpu_quota = "none"
scratch_limit_bytes = 2147483648
state = "not_yet_executable"
pending = "p3a/p3b: native PID-1 supervisor, container capability probe and host fingerprint."

[environments.linux_x86_64_musl_hosted]
description = "Hosted Linux x86_64 running the shipping musl binary."
os = "linux"
arch = "x86_64"
libc = "musl"
runner = "github_hosted"
runner_label = "ubuntu-latest"
containment = "linux_container"
logical_cpus = 2
prefer_separate_physical_cores = true
memory_limit_bytes = 4294967296
pid_limit = 256
swap = "disabled"
network = "disabled"
cpu_quota = "none"
scratch_limit_bytes = 2147483648
state = "not_yet_executable"
pending = "p3a/p3b: native PID-1 supervisor, container capability probe and host fingerprint."

[environments.macos_arm64_local]
description = "A named, explicitly trusted local macOS arm64 host: discovery and nonspawning library cases."
os = "macos"
arch = "aarch64"
libc = "darwin"
runner = "trusted_local"
runner_label = "named-local-macos-arm64"
containment = "trusted_local_process_group"
swap = "host_default"
network = "host_default"
cpu_quota = "none"
scratch_limit_bytes = 2147483648
state = "not_yet_executable"
pending = "p3b: trusted local process-group execution and host fingerprint."

# Tiers: the first profile is the default; a manual run may select another. ------------------

[tiers.quick]
description = "Pull requests and main pushes."
profiles = [{ environment = "linux_x86_64_gnu_hosted", recipe = "linux_gnu_native_release" }]
shards = 2
concurrent_jobs = 2
shard_sampling_minutes = 15
run_total_minutes = 60

[tiers.nightly]
description = "Frozen main against the highest reachable stable release."
profiles = [
  { environment = "linux_x86_64_musl_hosted", recipe = "linux_musl_shipping" },
  { environment = "macos_arm64_local", recipe = "macos_arm64_native_release" },
]
shards = 4
concurrent_jobs = 4
shard_sampling_minutes = 45
run_total_minutes = 120

# Synthetic cases -----------------------------------------------------------------------------

[cases.synthetic_fast]
family = "synthetic"
description = "SYNTHETIC: a cheap library case."
kind = "library"
requires_linux_containment = false
timing = { boundary = "library_region", region = "synthetic_region", setup_excluded = [], description = "Synthetic region." }
cache = { process = "fresh", store = "not_applicable", projection = "not_applicable", os_page_cache = "warm" }
oracle = { kind = "golden_canonical_digest", state = "pending_native_oracle", description = "Synthetic." }
execution = { state = "not_yet_executable", pending = "Synthetic fixture; never executed." }
tiers = ["quick", "nightly"]
criticality = "critical"
primary_metric = "wall_ms"
optional_metrics = []
policy = "wall_time_default"
pairs = { quick = 12, nightly = 20 }
warmup_pairs = 2
sample_timeout_seconds = 30
budgets = []
probe = { contract_id = "synthetic_fast_v1", repetitions = 1 }

[cases.synthetic_process]
