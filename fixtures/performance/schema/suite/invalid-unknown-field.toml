# SYNTHETIC registry for laboratory tests and committed comparison fixtures. It is not the
# product registry and no number produced under it describes the AF product. Its policy
# blocks are copied from fixtures/performance/suite.toml; its cases are synthetic.
#
# Four layers stay separate: workload (cases, parameter domains, oracles, timing and cache
# scope), policy (criticality, tolerances, budgets, pairs), recipe (build and instrument) and
# environment (capabilities and resources). `python3 scripts/performance/cli.py list` validates
# every reference and expands every parameter domain without building anything.
#
# Status: nothing here is executable. Every recipe, environment and case says so, its probe is
# declared not executable and every oracle is pending. Planning works; a run refuses.
# Every pair count and tolerance below is an initial policy choice, not a demonstrated
# sufficient value; the readiness cohort decides whether it is.

schema = "af.perf-suite/4"
suite_id = "af_performance_synthetic"
description = "Synthetic registry: small cases for deterministic comparison fixtures."
owner = "me"

[product_constraints]
# Recorded so fixtures are generated against them; the laboratory never changes them.
task_lease_ms = 60000
artifact_envelope_cap_bytes = 8388608
description = "Production Task lease and CAS artifact envelope cap at the design base."

[probe]
source = "crates/review-pipeline/examples/perf-probe.rs"
request = "af.perf-probe-request/2"
message = "af.perf-probe/1"
golden = "golden/synthetic.json"
sentinel_contract = "sentinel_canonical_v1"
state = "not_yet_executable"
pending = "Synthetic registry; its probe contracts are never executed."
description = "SYNTHETIC probe declaration."

[verdict]
algorithm = "paired_median_tolerance_v2"
family_alpha = "0.05"
advisory_alpha = "0.05"

[health]
rule = "sentinel_start_end_v1"
workload = "sentinel_canonical"
metric = "wall_ms"
# Fixed before calibration and never tuned after seeing candidate results.
batch_repetitions = 64
start_pairs = 5
end_pairs = 5
max_median_shift = "0.2"
max_mad_ratio = "0.2"
denominator_floor = "1"
state = "provisional"
description = "Baseline-versus-baseline sentinel pairs bracket each shard's schedule."

[health.oracle]
kind = "golden_canonical_digest"
state = "pending_native_oracle"
description = "The golden digest checks every repetition of the sentinel batch."

[limits]
sample_log_bytes = 262144
shard_bundle_bytes = 134217728
build_artifact_bytes = 1073741824
worktree_bytes = 42949672960
free_disk_floor_bytes = 10737418240
build_minutes = 20

# Metrics -------------------------------------------------------------------------------------

[metrics.wall_ms]
unit = "ms"
direction = "lower_is_better"
description = "Monotonic wall time of the declared timing boundary; the product metric."

[metrics.user_cpu_ms]
unit = "ms"
direction = "lower_is_better"
description = "OS-accounted user CPU time; diagnostic, never summed with overlapping records."

[metrics.system_cpu_ms]
unit = "ms"
direction = "lower_is_better"
description = "OS-accounted system CPU time; diagnostic."

[metrics.context_switches]
unit = "count"
direction = "lower_is_better"
description = "Voluntary plus involuntary context switches as the OS reports them; diagnostic."

[metrics.page_faults]
unit = "count"
direction = "lower_is_better"
description = "Major plus minor page faults as the OS reports them; diagnostic."

[metrics.cgroup_peak_memory_bytes]
unit = "bytes"
direction = "lower_is_better"
description = "cgroup v2 memory.peak of the sample's process tree, including accounted cache; not RSS."

[metrics.wait4_maxrss_bytes]
unit = "bytes"
direction = "lower_is_better"
description = "wait4 maximum resident set size converted to bytes per platform; diagnostic."

[metrics.logical_bytes]
unit = "bytes"
direction = "lower_is_better"
description = "Logical bytes written or read by a persistence diagnostic."

# Policies ------------------------------------------------------------------------------------

[policies.wall_time_default]
metric = "wall_ms"
relative_tolerance = "0.05"
absolute_tolerance = "1"
calibration = "initial"
description = "Initial wall-time policy r = 0.05, a = 1 ms; not a claim that hosted CI resolves 5%."

# Budgets begin pending calibration; a reviewed policy change may enable them. -----------------

[budgets.cli_discovery_under_50ms]
metric = "wall_ms"
limit = "50"
unit = "ms"
comparison = "every_sample_strictly_below"
minimum_samples = 20
state = "pending_calibration"
tiers = ["nightly", "release"]
environments = ["linux_x86_64_musl_hosted", "macos_arm64_local"]
recipes = ["linux_musl_shipping", "macos_arm64_native_release"]
description = "CLI discovery under 50 ms: every shipping sample on the named environment."

[budgets.state_read_under_200ms]
metric = "wall_ms"
limit = "200"
unit = "ms"
comparison = "every_sample_strictly_below"
minimum_samples = 20
state = "pending_calibration"
tiers = ["nightly", "release"]
environments = ["linux_x86_64_musl_hosted"]
recipes = ["linux_musl_shipping"]
description = "State reads of 10,000 relevant events under 200 ms; macOS coverage is unavailable in v1."

# Workload fixtures: descriptors only. Package p2 generates the bytes and the golden entries. --

[fixtures.sentinel_canonical]
kind = "canonical_small"
description = "Fixed small canonical workload repeated batch_repetitions times by every sentinel."
golden = "pending_native_oracle"

[fixtures.small_envelope]
kind = "typed_envelope"
description = "A small typed envelope for the cheap canonical and CAS cases."
serialized_envelope_bytes = 4096
size_rule = "approximate"
golden = "pending_native_oracle"

[fixtures.issue_255_medium]
kind = "typed_envelope"
description = "Issue #255 medium package: approximately 1.9 MB of serialized envelope."
serialized_envelope_bytes = 1900000
size_rule = "approximate"
golden = "pending_native_oracle"

[fixtures.issue_255_large]
kind = "typed_envelope"
description = "Issue #255 large package: exactly 5,605,230 serialized envelope bytes, below the cap."
serialized_envelope_bytes = 5605230
size_rule = "exact"
golden = "pending_native_oracle"

[fixtures.source_files_128b]
kind = "file_tree"
description = "Deterministic 128-byte files; the file count is the case parameter."
file_bytes = 128
golden = "pending_native_oracle"

[fixtures.events_10000]
kind = "event_log"
description = "Exactly 10,000 valid relevant events for the state library projection."
events = 10000
golden = "pending_native_oracle"

[fixtures.cli_state_10000]
kind = "cli_state"
description = "Task and Campaign state with exactly 10,000 relevant events, written by each side's own writers."
events = 10000
golden = "pending_native_oracle"

[fixtures.cli_task_roots]
kind = "cli_task"
description = "A Task with RootInputs and a check of `true`; each side creates it through its supported writers."
golden = "pending_native_oracle"

# Recipes -------------------------------------------------------------------------------------

