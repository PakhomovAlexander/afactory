# Native probe adapters of the AF performance laboratory (ADR-0166).
#
# An adapter is a reviewed copy of authority example files that a build overlays onto a measured
# source before compiling that source's own package. It never replaces a product manifest, a
# crate's own sources or Cargo.lock. Builds try adapters strictly in priority order, record every
# outcome, and choose the first that compiles; a runtime or oracle failure never selects another.
# Each contract has at most four adapters. Adapters that measure the same workload, timing
# boundary, oracle and policy share an equivalence group; a comparison across different groups
# is incompatible build evidence. A source no adapter compiles against has unavailable native
# coverage. Each adapter declares the first AF release it covers (`min_version`); a submission
# refuses, before any claim or build, a side whose release no adapter declares or whose plan
# runs a contract no declared adapter serves. The public-API probe's first declared release is
# 0.12.0-rc.3, the implementation base whose real builds compiled it (ADR-0168, ADR-0169).

schema = "af.perf-adapters/2"
description = "Native public-API probe adapters, by fixed priority."

[adapters.native_probe_public_api_v1]
kind = "native_probe"
description = "The authority's perf-probe example and its complete helper-module closure, built in the measured source's review-pipeline package."
priority = 1
equivalence_group = "native_probe_public_api_v1"
min_version = "0.12.0-rc.3"
package = "review-pipeline"
example = "perf-probe"
contracts = [
  "authority_plan_check_v3",
  "authority_runtime_new_v3",
  "authority_seed_v1",
  "canonical_serialize_v1",
  "canonical_validate_v1",
  "cas_raw_get_verify_v1",
  "cas_typed_get_validate_v1",
  "persistence_fs_v1",
  "sentinel_canonical_v1",
  "source_capture_seed_v1",
  "source_capture_v2",
  "state_projection_seed_v1",
  "state_projection_v2",
]
closure = [
  "crates/review-pipeline/examples/perf-probe.rs",
  "crates/review-pipeline/examples/perf-probe/authority.rs",
  "crates/review-pipeline/examples/perf-probe/cases.rs",
  "crates/review-pipeline/examples/perf-probe/control.rs",
  "crates/review-pipeline/examples/perf-probe/fixtures.rs",
  "crates/review-pipeline/examples/perf-probe/protocol.rs",
]
