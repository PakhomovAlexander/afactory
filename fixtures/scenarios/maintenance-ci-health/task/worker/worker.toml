schema = "af.worker/1"
name = "ci/diagnosis-worker"
version = "1.0.3"
[signature]
effects = []
roles = ["diagnose"]
evidence = {}
retains = { diagnosis = ["snapshot", "requirements"] }
worker_input_type = "custom/StructuredInput@1"
worker_output_type = "custom/CiDiagnosis@1"
[signature.attempt]
tokens = 1000
wall_ms = 500000
[runner]
kind = "model"
provider_kind = "codex"
model = "gpt-6.1-sol"
effort = "medium"

[signature.contract.inputs.requirements]
artifact_type = "af/Requirements@1"
cardinality = "one"
optional = false
covers = []
[signature.contract.inputs.requirements.affinity]
kind = "unbound"

[signature.contract.inputs.snapshot]
artifact_type = "custom/CiHealthSnapshot@1"
cardinality = "one"
optional = false
covers = []
[signature.contract.inputs.snapshot.affinity]
kind = "unbound"

[signature.contract.outputs.diagnosis]
artifact_type = "custom/CiDiagnosis@1"
cardinality = "one"
optional = false
covers = []
[signature.contract.outputs.diagnosis.affinity]
kind = "unbound"
