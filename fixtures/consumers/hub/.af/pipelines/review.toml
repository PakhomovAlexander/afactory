# The hub's review pipeline, as a definition rather than as code.
#
# One high-effort correctness reviewer, one required clean Round, at most two Rounds — the shape
# the kernel adopted in ADR-0027 after the two-specialist, two-million-token pipeline never
# converged. The reviewer is a package from .af/workers/, pinned by content digest in .af/af.lock.
# The package and lock entry mirror the kernel repo's `.af/workers/correctness` byte for byte: to
# change the package, copy the kernel's package and lock entry together, then re-pin with
# `af onboard --refresh-lock` (from a source build, `cargo run -p reviewctl --bin af -- onboard
# --refresh-lock`). The pinned release must still accept this file: `make review-plan` proves it
# without spending tokens.
version = 2
check_timeout_seconds = 3600

[subject]
kind = "diff"

# ---------------------------------------------------------------- gate checks
# Programs and options are trusted literals. A value derived from the change under review must be
# marked `untrusted`, and can then never occupy an option position.
#
# A Gate Check runs in a sandbox with no network guarantee, so it never fetches its own tool: no
# `npx --yes <tool>@<version>`, which reaches the registry on every cold run. The lint calls a
# checked-in wrapper that installs a lock-pinned toolchain instead, and it is advisory — an
# installer that cannot reach a registry would otherwise block the Gate and lose the Round with
# no reviewer, which is a steep price for a lint. Enforce lint in CI, where the network exists.
[[checks]]
name = "markdownlint"
program = "bash"
args = [{ value = "scripts/markdownlint.sh" }]
required = false

[[checks]]
name = "hub-verify"
program = "bash"
args = [{ value = "scripts/verify.sh" }]
required = true

# ---------------------------------------------------------------------- nodes
[[nodes]]
id = "gate"
kind = "gate"
outputs = [{ name = "decision", type = "review.kernel/GateDecision@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]

# The campaign's prior findings, delivered to reviewers through a wired port rather than from
# ambient kernel state. In round 1 it emits an empty set; from round 2 on it carries what the
# earlier rounds found, and each reviewer is asked to confirm, dispute, or drop each one.
[[nodes]]
id = "generation"
kind = "generation"
outputs = [
  { name = "findings", type = "review.kernel/PriorFindings@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
  { name = "change_set", type = "review.kernel/ChangeSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
]

[[nodes]]
id = "correctness"
kind = "reviewer"
demands = "required"
inputs = [
  { name = "gate", type = "review.kernel/GateDecision@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
  { name = "prior_findings", type = "review.kernel/PriorFindings@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
  { name = "change_set", type = "review.kernel/ChangeSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
]
outputs = [{ name = "result", type = "review.kernel/ReviewerResult@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]
gated_by = "gate"
package = "correctness"

[[nodes]]
id = "gather"
kind = "gather"
inputs = [
  { name = "correctness", type = "review.kernel/ReviewerResult@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
]
outputs = [{ name = "reports", type = "review.kernel/ReportSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]

[[nodes]]
id = "ledger"
kind = "ledger"
inputs = [{ name = "reports", type = "review.kernel/ReportSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]
outputs = [
  { name = "findings", type = "review.kernel/FindingSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
  { name = "demands", type = "review.kernel/DemandSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
]

# ---------------------------------------------------------------------- edges
[[edges]]
from = { node = "generation", port = "findings" }
to = { node = "correctness", port = "prior_findings" }

[[edges]]
from = { node = "generation", port = "change_set" }
to = { node = "correctness", port = "change_set" }

[[edges]]
from = { node = "gate", port = "decision" }
to = { node = "correctness", port = "gate" }

[[edges]]
from = { node = "correctness", port = "result" }
to = { node = "gather", port = "correctness" }

[[edges]]
from = { node = "gather", port = "reports" }
to = { node = "ledger", port = "reports" }

# -------------------------------------------------------------------- budgets
# One high-effort correctness reviewer. The cap admits its first attempt and retries while
# bounding a milestone below the former two-specialist, two-million-token shape.
[budgets]
unit = "tokens"
attempt = 300000
run = 1000000

# ---------------------------------------------------------------- convergence
[convergence]
clean_rounds = 1
max_rounds = 2
gate = "major"
