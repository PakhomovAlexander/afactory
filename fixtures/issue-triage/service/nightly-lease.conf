# Operator-installed drop-in for af-nightly-build.service. The existing builder's plan,
# configuration, outputs and handoff are unchanged; the wrapper adds shared exclusion.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 -I -B /opt/af-perf/control/scripts/backlog-triage.py nightly-build --config /etc/af-nightly/nightly.toml
PrivateTmp=no
PrivateMounts=no
