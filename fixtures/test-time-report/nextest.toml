# A miniature of .config/nextest.toml for scripts/test-test-time-report.py: only the override
# that requires every test thread is the exclusive block; the other one is not.
[profile.ci]
test-threads = 4
retries = 0

[profile.ci.junit]
path = "junit.xml"

[[profile.ci.overrides]]
filter = '''
test(/::alone_with_a_budget$/)
| test(/measured_elapsed$/)
'''
threads-required = "num-test-threads"
priority = 100

[[profile.ci.overrides]]
filter = 'test(/^unit::/)'
threads-required = 2
