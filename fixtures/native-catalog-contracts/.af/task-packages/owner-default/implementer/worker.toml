schema = "af.worker/1"
name = "owner-default/implementer"
version = "1.0.0"

[signature]
effects = ["write-source", "execute-checks"]
roles = ["implement"]
worker_input_type = "af/ImplementationInput@2"
worker_output_type = "af/ImplementationReport@1"

[signature.contract.inputs.requirements]
artifact_type = "af/Requirements@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.inputs.requirements.affinity]
kind = "unbound"

[signature.contract.inputs.source]
artifact_type = "af/SourceTree@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.inputs.source.affinity]
kind = "unbound"

[signature.contract.inputs.findings]
artifact_type = "af/TaskReviewFindings@1"
cardinality = "one"
optional = true
covers = []

[signature.contract.inputs.findings.affinity]
kind = "unbound"

[signature.contract.outputs.candidate]
artifact_type = "af/CandidateTree@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.outputs.candidate.affinity]
kind = "same_as"
input = "source"

[signature.contract.outputs.report]
artifact_type = "af/ImplementationReport@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.outputs.report.affinity]
kind = "same_as"
input = "source"

[signature.evidence]

[signature.retains]
candidate = ["requirements", "source", "research_report"]
report = ["requirements", "source", "research_report"]

[signature.attempt]
tokens = 1500000
wall_ms = 10800000

[runner]
kind = "model"
provider_kind = "codex"
model = "gpt-6.1-sol"
effort = "medium"

[signature.contract.inputs.research_report]
artifact_type = "af/Document@1"
cardinality = "one"
optional = true
covers = []

[signature.contract.inputs.research_report.affinity]
kind = "unbound"
