schema = "af.pipeline/1"
name = "builtin/optimization-light"
version = "1.0.0"
max_attempts = 83
max_parallel = 1

[contract.inputs.source]
artifact_type = "af/SourceTree@1"
cardinality = "one"
optional = false
covers = []
[contract.inputs.source.affinity]
kind = "unbound"
[contract.inputs.requirements]
artifact_type = "af/Requirements@1"
cardinality = "one"
optional = false
covers = []
[contract.inputs.requirements.affinity]
kind = "unbound"
[contract.inputs.history]
artifact_type = "af/OptimizationHistory@1"
cardinality = "one"
optional = false
covers = []
[contract.inputs.history.affinity]
kind = "unbound"

[contract.outputs.economics]
artifact_type = "af/OptimizationEconomics@1"
cardinality = "one"
optional = false
covers = []
[contract.outputs.economics.affinity]
kind = "unbound"
[contract.outputs.proposal]
artifact_type = "af/OptimizationProposal@1"
cardinality = "one"
optional = false
covers = []
[contract.outputs.proposal.affinity]
kind = "unbound"
[contract.outputs.comparison]
artifact_type = "af/ExperimentComparison@1"
cardinality = "one"
optional = false
covers = ["experiment"]
[contract.outputs.comparison.affinity]
kind = "unbound"
[contract.outputs.snapshot]
artifact_type = "af/SourceTree@1"
cardinality = "one"
optional = false
covers = []
[contract.outputs.snapshot.affinity]
kind = "derived_from"
input = "source"
[contract.outputs.verification]
artifact_type = "af/OptimizationVerification@1"
cardinality = "one"
optional = false
covers = ["verified"]
[contract.outputs.verification.affinity]
kind = "derived_from"
input = "source"
[contract.outputs.result]
artifact_type = "af/OptimizationResult@1"
cardinality = "one"
optional = true
covers = []
[contract.outputs.result.affinity]
kind = "unbound"

[accepts]
kinds = ["optimize"]
[accepts.required_facts]
experimental = true
finalize = true
light = true

[slots.diagnose]
worker = "builtin/optimization-light-diagnose-model"
role = "diagnose"
input_type = "af/OptimizationDiagnosisInput@1"
output_type = "af/OptimizationDiagnostic@1"
min_attempts = 1
max_attempts = 1
allow_local_replacement = false
independent_from = []
[slots.propose]
worker = "builtin/optimization-light-propose-model"
role = "propose"
input_type = "af/OptimizationProposalInput@1"
output_type = "af/OptimizationProposal@1"
min_attempts = 1
max_attempts = 1
allow_local_replacement = false
independent_from = ["diagnose"]
[slots.baseline]
worker = "builtin/optimization-check-baseline"
role = "optimize"
input_type = "af/OptimizationArmInput@1"
output_type = "af/OptimizationArmReceipt@1"
min_attempts = 0
max_attempts = 1
allow_local_replacement = false
independent_from = ["candidate"]
[slots.candidate]
worker = "builtin/optimization-check-candidate"
role = "optimize"
input_type = "af/OptimizationArmInput@1"
output_type = "af/OptimizationArmReceipt@1"
min_attempts = 0
max_attempts = 1
allow_local_replacement = false
independent_from = ["baseline"]
[slots.evaluator]
worker = "builtin/optimization-check-evaluator"
role = "evaluate"
input_type = "af/OptimizationEvaluationInput@1"
output_type = "af/OptimizationEvaluation@1"
min_attempts = 1
max_attempts = 1
allow_local_replacement = false
independent_from = ["baseline", "candidate", "diagnose", "propose"]

[[nodes]]
id = "profile"
[nodes.operator]
op = "optimization_profile"
[nodes.inputs.history]
kind = "input"
port = "history"
[nodes.inputs.source]
kind = "input"
port = "source"

