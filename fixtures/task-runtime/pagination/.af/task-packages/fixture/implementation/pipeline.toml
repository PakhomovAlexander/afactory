schema = "af.pipeline/1"
name = "fixture/implementation"
version = "1.0.0"
max_attempts = 3
max_parallel = 2

[contract.inputs.requirements]
artifact_type = "af/Requirements@1"
cardinality = "one"
optional = false
covers = []

[contract.inputs.requirements.affinity]
kind = "unbound"

[contract.inputs.source]
artifact_type = "af/SourceTree@1"
cardinality = "one"
optional = false
covers = []

[contract.inputs.source.affinity]
kind = "unbound"

[contract.outputs.snapshot]
artifact_type = "af/SourceTree@1"
cardinality = "one"
optional = false
covers = []

[contract.outputs.snapshot.affinity]
kind = "derived_from"
input = "source"

[contract.outputs.verification]
artifact_type = "af/VerificationResult@1"
cardinality = "one"
optional = false
covers = ["verified"]

[contract.outputs.verification.affinity]
kind = "derived_from"
input = "source"

[accepts]
kinds = ["implement"]

[accepts.required_facts]

[slots.evaluator]
worker = "fixture/evaluator"
role = "evaluate"
input_type = "af/EvaluationInput@1"
output_type = "af/TaskEvaluation@1"
min_attempts = 1
max_attempts = 1
allow_local_replacement = true
independent_from = ["implementer"]

[slots.implementer]
worker = "fixture/implementer"
role = "implement"
input_type = "af/ImplementationInput@1"
output_type = "af/ImplementationReport@1"
min_attempts = 1
max_attempts = 1
allow_local_replacement = true
independent_from = []

[[nodes]]
id = "implement"

[nodes.operator]
op = "worker"
slot = "implementer"

[nodes.inputs.requirements]
kind = "input"
port = "requirements"

[nodes.inputs.source]
kind = "input"
port = "source"

[[nodes]]
id = "seal"

[nodes.operator]
op = "seal"

[nodes.inputs.candidate]
kind = "node"
node = "implement"
port = "candidate"

[[nodes]]
id = "check"

[nodes.operator]
op = "check"
checks = ["pagination"]

[nodes.inputs.source]
kind = "node"
node = "seal"
port = "snapshot"

[[nodes]]
id = "evaluate"

[nodes.operator]
op = "verify"
slot = "evaluator"

[nodes.inputs.checks]
kind = "node"
node = "check"
port = "result"

[nodes.inputs.requirements]
kind = "input"
port = "requirements"

[nodes.inputs.source]
kind = "node"
node = "seal"
port = "snapshot"

[nodes.when]
node = "check"
outcome = "passed"

[[nodes]]
id = "accept"

[nodes.operator]
op = "accept"

[nodes.inputs.checks]
kind = "node"
node = "check"
port = "result"

[nodes.inputs.evaluation]
kind = "node"
node = "evaluate"
port = "result"

[nodes.inputs.source]
kind = "node"
node = "seal"
port = "snapshot"

[outputs.snapshot]
kind = "node"
node = "accept"
port = "snapshot"

[outputs.verification]
kind = "node"
node = "accept"
port = "result"

[coverage.verified]
kind = "node"
node = "accept"
port = "result"
