schema = "af.worker/1"
name = "fixture/bugs"
version = "1.0.0"

[signature]
effects = ["read-source"]
roles = ["review"]
worker_input_type = "af/ReviewInput@1"
worker_output_type = "review.kernel/ReviewerResult@2"

[signature.contract.inputs.assignment]
artifact_type = "af/TaskReviewAssignment@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.inputs.assignment.affinity]
kind = "same_as"
input = "source"

[signature.contract.inputs.checks]
artifact_type = "af/TaskCheckReceipt@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.inputs.checks.affinity]
kind = "same_as"
input = "source"

[signature.contract.inputs.history]
artifact_type = "af/ReviewHistory@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.inputs.history.affinity]
kind = "unbound"

[signature.contract.inputs.source]
artifact_type = "af/SourceTree@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.inputs.source.affinity]
kind = "unbound"

[signature.contract.inputs.subject]
artifact_type = "af/TaskReviewSubject@2"
cardinality = "one"
optional = false
covers = []

[signature.contract.inputs.subject.affinity]
kind = "same_as"
input = "source"

[signature.contract.outputs.result]
artifact_type = "review.kernel/ReviewerResult@2"
cardinality = "one"
optional = false
covers = []

[signature.contract.outputs.result.affinity]
kind = "same_as"
input = "source"

[signature.evidence]

[signature.retains]
result = ["assignment", "checks", "history", "source", "subject"]

[signature.attempt]
tokens = 0
wall_ms = 5000

[runner]
kind = "command"

[runner.command]
program = "/usr/bin/python3"

[[runner.command.args]]
value = "-B"
provenance = "literal"

[[runner.command.args]]
value = "@package/worker.py"
provenance = "literal"
