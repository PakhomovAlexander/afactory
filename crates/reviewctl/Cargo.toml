[package]
name = "reviewctl"
description = "Afactory's Review Kernel CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "af"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
review-config = { path = "../review-config" }
review-attempt = { path = "../review-attempt" }
review-check = { path = "../review-check" }
review-core = { path = "../review-core" }
review-graph = { path = "../review-graph" }
review-parallel = { path = "../review-parallel" }
review-pipeline = { path = "../review-pipeline" }
review-runner = { path = "../review-runner" }
review-runner-claude = { path = "../review-runner-claude" }
review-runner-codex = { path = "../review-runner-codex" }
review-source-git = { path = "../review-source-git" }
review-store = { path = "../review-store" }
review-sandbox = { path = "../review-sandbox" }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = "0.10.9"
tempfile = "3.27.0"
toml = "0.8.23"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["fs", "signal"] }
portable-pty = { version = "0.9.0", default-features = false }

[lints]
workspace = true
