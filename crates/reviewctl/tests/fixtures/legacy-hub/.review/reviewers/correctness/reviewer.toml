name = "correctness"
version = "1.0.0"
subjects = ["diff", "whole-tree"]

[runner]
program = "codex"
# Pin correctness independently of the machine-wide Codex profile. The adapter
# still owns its exec, sandbox, output-schema, and stdin arguments.
args = [
  { value = "--model" },
  { value = "gpt-5.6-terra" },
  { value = "-c" },
  { value = 'model_reasoning_effort="xhigh"' },
]
