[package]
name = "af-runner-codex"
description = "Codex Worker adapter: digest-pinned packages driving `codex exec` for Tasks and Review"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# No crate in this workspace has a doctest, and each empty rustdoc run still costs a
# compile; the first doctest sets this back to true for its crate (ADR-0124).
doctest = false

[dependencies]
af-contracts = { path = "../af-contracts" }
af-runner = { path = "../af-runner" }
af-store = { path = "../af-store" }
rustix = { version = "1.1.4", features = ["fs"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tempfile = "3.27.0"

[dev-dependencies]
# The Telemetry level fixtures record an Attempt through the write side only (ADR-0153).
af-telemetry = { path = "../af-telemetry" }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[lints]
workspace = true
