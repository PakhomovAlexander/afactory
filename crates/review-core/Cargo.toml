[package]
name = "review-core"
description = "Review Kernel v1 contracts: artifact envelope, snapshots, finding reports, patch proposals, run events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# No crate in this workspace has a doctest, and each empty rustdoc run still costs a
# compile; the first doctest sets this back to true for its crate (ADR-0124).
doctest = false

[dependencies]
base64 = "0.23.1"
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }

[features]
# Phase spans for the performance laboratory's diagnostic builds (ADR-0174). Off by default and
# in every product build; `perf_trace::span` is then a zero-sized guard that does nothing.
perf-trace = []
# The calibration loop of the laboratory's slowdown trials (ADR-0181). Off by default and in
# every product and budget build, where `perf_calibration` refuses any injection control.
perf-calibration = []

[dev-dependencies]
jsonschema = { version = "0.58.4", default-features = false }

[lints]
workspace = true
