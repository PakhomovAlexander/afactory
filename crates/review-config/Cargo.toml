[package]
name = "review-config"
description = "The pipeline definition format: a review that is configured rather than constructed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
review-check = { path = "../review-check" }
review-core = { path = "../review-core" }
review-runner = { path = "../review-runner" }
review-graph = { path = "../review-graph" }
review-store = { path = "../review-store" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
toml = "0.8.23"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
