[package]
name = "af-runner"
description = "Worker transport, input composition, adapter contracts and Provider-neutral model validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# No crate in this workspace has a doctest, and each empty rustdoc run still costs a
# compile; the first doctest sets this back to true for its crate (ADR-0124).
doctest = false

[dependencies]
af-contracts = { path = "../af-contracts" }
af-process = { path = "../af-process" }
af-store = { path = "../af-store" }
af-telemetry = { path = "../af-telemetry" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
jsonschema = { version = "0.60.2", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
