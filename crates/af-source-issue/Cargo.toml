[package]
name = "af-source-issue"
description = "Bounded read-only issue sources normalized to captured Task requirements"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# No crate in this workspace has a doctest, and each empty rustdoc run still costs a
# compile; the first doctest sets this back to true for its crate (ADR-0124).
doctest = false

[dependencies]
af-contracts = { path = "../af-contracts" }
af-process = { path = "../af-process" }
af-store = { path = "../af-store" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
toml = "1.1.6"
tempfile = "3.27.0"

[lints]
workspace = true
