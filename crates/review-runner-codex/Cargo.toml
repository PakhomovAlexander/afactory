[package]
name = "review-runner-codex"
description = "The Codex reviewer adapter: a digest-pinned package driving `codex exec` behind the reviewer contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# No crate in this workspace has a doctest, and each empty rustdoc run still costs a
# compile; the first doctest sets this back to true for its crate (ADR-0124).
doctest = false

[dependencies]
review-core = { path = "../review-core" }
review-runner = { path = "../review-runner" }
# The one validation authority for model and effort spellings lives beside grammar G in the
# Claude adapter crate, and serves both adapters (ADR-0148).
review-runner-claude = { path = "../review-runner-claude" }
review-store = { path = "../review-store" }
rustix = { version = "1.1.4", features = ["fs"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tempfile = "3.27.0"

[dev-dependencies]
# The Telemetry level fixtures record an Attempt through the write side only (ADR-0153).
review-telemetry = { path = "../review-telemetry" }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Tests build real locked packages; the library itself never touches the config layer.
review-config = { path = "../review-config" }

[lints]
workspace = true
