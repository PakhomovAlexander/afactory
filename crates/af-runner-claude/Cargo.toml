[package]
name = "af-runner-claude"
description = "Claude Worker adapter: digest-pinned packages driving `claude -p` for Tasks and Review"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# No crate in this workspace has a doctest, and each empty rustdoc run still costs a
# compile; the first doctest sets this back to true for its crate (ADR-0124).
doctest = false

[dependencies]
af-contracts = { path = "../af-contracts" }
af-runner = { path = "../af-runner" }
af-store = { path = "../af-store" }
# Removing an Attempt's project directory goes through the sandbox's identity-bound, claimed
# removal (ADR-0144), shared with every other removal af makes.
af-sandbox = { path = "../af-sandbox" }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
# Session capture and its idempotent deletion open every component of the operator's harness
# directory `O_NOFOLLOW`, which needs the same safe syscall wrappers the sandbox already uses.
nix = { version = "0.31.3", default-features = false, features = ["dir", "fs"] }

[dev-dependencies]
# The Telemetry level fixtures record an Attempt through the write side only (ADR-0153).
af-telemetry = { path = "../af-telemetry" }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
jsonschema = { version = "0.60.2", default-features = false }
tempfile = "3.27.0"

[lints]
workspace = true
