[package]
name = "af-check"
description = "Typed Check nodes: trusted programs with typed argument slots, per-attempt CheckResult records, and a gate that treats an unrun check as unverified"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# No crate in this workspace has a doctest, and each empty rustdoc run still costs a
# compile; the first doctest sets this back to true for its crate (ADR-0124).
doctest = false

[dependencies]
af-contracts = { path = "../af-contracts" }
af-process = { path = "../af-process" }
af-store = { path = "../af-store" }
af-telemetry = { path = "../af-telemetry" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = "0.11.0"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
jsonschema = { version = "0.58.4", default-features = false }
tempfile = "3.27.0"

[lints]
workspace = true
