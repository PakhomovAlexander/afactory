[package]
name = "review-source-git"
description = "Git source adapter: content-identified snapshots captured offline through sanitized plumbing, and materialization into sandboxes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# No crate in this workspace has a doctest, and each empty rustdoc run still costs a
# compile; the first doctest sets this back to true for its crate (ADR-0124).
doctest = false

[dependencies]
review-core = { path = "../review-core" }
review-parallel = { path = "../review-parallel" }
review-process = { path = "../review-process" }
review-store = { path = "../review-store" }
review-telemetry = { path = "../review-telemetry" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
notify = "8.2.0"
reflink-copy = "0.1.19"
# Folds NFC/NFD twins when a sandbox volume normalises names (materialize.rs).
unicode-normalization = "0.1.26"
nix = { version = "0.31.3", default-features = false, features = ["dir", "fs"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
jsonschema = { version = "0.58.4", default-features = false }

[lints]
workspace = true
