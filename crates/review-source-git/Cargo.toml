[package]
name = "review-source-git"
description = "Git source adapter: content-identified snapshots captured offline through sanitized plumbing, and materialization into sandboxes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
review-core = { path = "../review-core" }
review-store = { path = "../review-store" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = "0.10.9"
tempfile = "3.27.0"

[dev-dependencies]
jsonschema = { version = "0.26.1", default-features = false }

[lints]
workspace = true
