[package]
name = "review-telemetry"
description = "Telemetry: per-process segments, blobs, structured redaction, the tracing subscriber and the rebuildable index (ADR-0153)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# No crate in this workspace has a doctest, and each empty rustdoc run still costs a
# compile; the first doctest sets this back to true for its crate (ADR-0124).
doctest = false

# A leaf: nothing in the workspace. `review-process` never links this crate (ADR-0026).
[dependencies]
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
nix = { version = "0.31.3", default-features = false, features = ["dir", "fs", "feature", "user"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = "0.11.0"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-core = { version = "0.1.36", default-features = false, features = ["std"] }

[dev-dependencies]
jsonschema = { version = "0.58.4", default-features = false }
tempfile = "3.27.0"

[lints]
workspace = true
