[package]
name = "review-pipeline"
description = "Composition: the typed graph driving real capture, sandboxes, checks, reviewers and the ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
review-attempt = { path = "../review-attempt" }
review-broker = { path = "../review-broker" }
review-check = { path = "../review-check" }
review-config = { path = "../review-config" }
review-core = { path = "../review-core" }
review-graph = { path = "../review-graph" }
review-parallel = { path = "../review-parallel" }
review-runner = { path = "../review-runner" }
review-sandbox = { path = "../review-sandbox" }
review-source-git = { path = "../review-source-git" }
review-store = { path = "../review-store" }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.27.0"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
jsonschema = { version = "0.26.1", default-features = false }
toml = "0.8.23"

[lints]
workspace = true
