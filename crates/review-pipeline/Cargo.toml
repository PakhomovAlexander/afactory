[package]
name = "review-pipeline"
description = "Composition: the typed graph driving real capture, sandboxes, checks, reviewers and the ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
review-attempt = { path = "../review-attempt" }
review-check = { path = "../review-check" }
review-config = { path = "../review-config" }
review-core = { path = "../review-core" }
review-graph = { path = "../review-graph" }
review-runner = { path = "../review-runner" }
review-sandbox = { path = "../review-sandbox" }
review-source-git = { path = "../review-source-git" }
review-store = { path = "../review-store" }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.27.0"
toml = "0.8.23"
toml_edit = "0.22.27"

[dev-dependencies]
# One test pins that `af review render`, which composes through the adapters, shows the
# instructions the Task host dispatches.
review-runner-claude = { path = "../review-runner-claude" }
review-runner-codex = { path = "../review-runner-codex" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
jsonschema = { version = "0.56.0", default-features = false }

[lints]
workspace = true
