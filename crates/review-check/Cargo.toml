[package]
name = "review-check"
description = "Typed Check nodes: trusted programs with typed argument slots, per-attempt CheckResult records, and a gate that treats an unrun check as unverified"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
review-core = { path = "../review-core" }
review-store = { path = "../review-store" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }

# killpg without unsafe: the gate's check deadline must reap a whole process group, not one
# PID — a wrapper check (npx -> node) leaves a grandchild holding the pipe otherwise.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["signal"] }

[dev-dependencies]
jsonschema = { version = "0.26.1", default-features = false }
tempfile = "3.27.0"

[lints]
workspace = true
