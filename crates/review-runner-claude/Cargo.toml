[package]
name = "review-runner-claude"
description = "The Claude reviewer adapter: a digest-pinned package driving `claude -p` behind the reviewer contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
review-core = { path = "../review-core" }
review-runner = { path = "../review-runner" }
review-store = { path = "../review-store" }
serde_json = { version = "1.0.149", features = ["preserve_order"] }

[dev-dependencies]
# Tests build real locked packages; the library itself never touches the config layer.
review-config = { path = "../review-config" }
tempfile = "3.27.0"

[lints]
workspace = true
