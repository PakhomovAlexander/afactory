[package]
name = "af-graph"
description = "The typed pipeline graph: named ports, deterministic planning, and gates compiled into Task conditions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# No crate in this workspace has a doctest, and each empty rustdoc run still costs a
# compile; the first doctest sets this back to true for its crate (ADR-0124).
doctest = false

[dependencies]
af-attempt = { path = "../af-attempt" }
af-contracts = { path = "../af-contracts" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }

[lints]
workspace = true
