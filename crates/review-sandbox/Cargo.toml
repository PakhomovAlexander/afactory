[package]
name = "review-sandbox"
description = "Sandbox providers: materialized trees, sealed mutation capture, and an isolation level a pipeline can refuse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
review-core = { path = "../review-core" }
review-parallel = { path = "../review-parallel" }
review-process = { path = "../review-process" }
review-source-git = { path = "../review-source-git" }
review-store = { path = "../review-store" }
# Copy-on-write clone (clonefile on macOS, FICLONE on Linux) with a plain-copy fallback, so a
# snapshot is materialized once per run and each sandbox is a cheap COW clone of it.
reflink-copy = "0.1.19"
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tempfile = "3.27.0"
# A runtime capability probe is bounded and kills the probe's whole process group on timeout.
# An installed Docker client with a wedged daemon must not hang the review gate forever.
nix = { version = "0.31.3", default-features = false, features = ["dir", "fs", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
exacl = "0.13.0"
rustix = { version = "1.1.4", features = ["fs"] }
xattr = "1.6.1"

[dev-dependencies]
review-check = { path = "../review-check" }

[lints]
workspace = true
