[package]
name = "review-attempt"
description = "Attempt lifecycle, fencing that makes a late result harmless, and budgets that reserve before they spend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# No crate in this workspace has a doctest, and each empty rustdoc run still costs a
# compile; the first doctest sets this back to true for its crate (ADR-0124).
doctest = false

[dependencies]
review-core = { path = "../review-core" }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"

[lints]
workspace = true
