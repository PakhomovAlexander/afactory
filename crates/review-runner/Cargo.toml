[package]
name = "review-runner"
description = "Reviewer adapters and the canonical gather barrier: concurrency without nondeterminism"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
review-broker = { path = "../review-broker" }
review-core = { path = "../review-core" }
review-process = { path = "../review-process" }
review-store = { path = "../review-store" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
jsonschema = { version = "0.56.0", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
