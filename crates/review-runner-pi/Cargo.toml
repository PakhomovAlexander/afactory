[package]
name = "review-runner-pi"
description = "AF-owned confined Pi SDK host and native Task adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
review-core = { path = "../review-core" }
review-runner = { path = "../review-runner" }
review-process = { path = "../review-process" }
review-store = { path = "../review-store" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = "0.10.9"
tempfile = "3.27.0"

[lints]
workspace = true
