[package]
name = "af-sandbox"
description = "Sandbox providers: materialized trees, sealed mutation capture, and an isolation level a pipeline can refuse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# No crate in this workspace has a doctest, and each empty rustdoc run still costs a
# compile; the first doctest sets this back to true for its crate (ADR-0124).
doctest = false

[dependencies]
af-contracts = { path = "../af-contracts" }
af-parallel = { path = "../af-parallel" }
af-process = { path = "../af-process" }
af-source-git = { path = "../af-source-git" }
af-store = { path = "../af-store" }
af-telemetry = { path = "../af-telemetry" }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Copy-on-write clone (clonefile on macOS, FICLONE on Linux) with a plain-copy fallback, so a
# snapshot is materialized once per run and each sandbox is a cheap COW clone of it.
reflink-copy = "0.1.19"
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tempfile = "3.27.0"
# A runtime capability probe is bounded and kills the probe's whole process group on timeout.
# An installed Docker client with a wedged daemon must not hang the review gate forever.
# `process` and `signal` give the stale-sandbox sweep its pid liveness check (`kill(pid, 0)`).
nix = { version = "0.31.3", default-features = false, features = ["dir", "fs", "process", "signal", "user"] }
# `statx` states a file's birth time on Linux with the inode it belongs to, the
# generation a born identity carries (ADR-0159 clause 2).
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
exacl = "0.13.0"
xattr = "1.6.1"

[dev-dependencies]
af-check = { path = "../af-check" }

[lints]
workspace = true
