# The heavy review, as a definition rather than as code.
#
# This is the hub's own pipeline: the shape /self-review-heavy runs today, expressed for the
# kernel. Reviewers are packages from .review/reviewers/, pinned by content digest in
# .review/review.lock — re-lock with
# `make review-kernel-lock` (writes through a temporary file, then replaces the lock atomically).
version = 2

[subject]
kind = "diff"

# ---------------------------------------------------------------- gate checks
# Programs and options are trusted literals. A value derived from the change under review must be
# marked `untrusted`, and can then never occupy an option position.
[[checks]]
name = "markdownlint"
program = "npx"
args = [
  { value = "--yes" },
  { value = "markdownlint-cli2@0.22.1" },
  { value = "**/*.md" },
]

[[checks]]
name = "hub-verify"
program = "bash"
args = [{ value = "scripts/verify.sh" }]

# ---------------------------------------------------------------------- nodes
[[nodes]]
id = "gate"
kind = "gate"
outputs = [{ name = "decision", type = "review.kernel/GateDecision@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]

# The campaign's prior findings, delivered to reviewers through a wired port rather than from
# ambient kernel state. In round 1 it emits an empty set; from round 2 on it carries what the
# earlier rounds found, and each reviewer is asked to confirm, dispute, or drop each one.
[[nodes]]
id = "generation"
kind = "generation"
outputs = [
  { name = "findings", type = "review.kernel/PriorFindings@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
  { name = "change_set", type = "review.kernel/ChangeSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
]

[[nodes]]
id = "architecture"
kind = "reviewer"
inputs = [
  { name = "gate", type = "review.kernel/GateDecision@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
  { name = "prior_findings", type = "review.kernel/PriorFindings@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
  { name = "change_set", type = "review.kernel/ChangeSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
]
outputs = [{ name = "result", type = "review.kernel/ReviewerResult@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]
gated_by = "gate"
package = "architecture"

[[nodes]]
id = "performance"
kind = "reviewer"
inputs = [
  { name = "gate", type = "review.kernel/GateDecision@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
  { name = "prior_findings", type = "review.kernel/PriorFindings@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
  { name = "change_set", type = "review.kernel/ChangeSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
]
outputs = [{ name = "result", type = "review.kernel/ReviewerResult@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]
gated_by = "gate"
package = "performance"

[[nodes]]
id = "gather"
kind = "gather"
inputs = [
  { name = "architecture", type = "review.kernel/ReviewerResult@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
  { name = "performance", type = "review.kernel/ReviewerResult@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" },
]
outputs = [{ name = "reports", type = "review.kernel/ReportSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]

[[nodes]]
id = "ledger"
kind = "ledger"
inputs = [{ name = "reports", type = "review.kernel/ReportSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]
outputs = [{ name = "findings", type = "review.kernel/FindingSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]

# ---------------------------------------------------------------------- edges
[[edges]]
from = { node = "generation", port = "findings" }
to = { node = "architecture", port = "prior_findings" }

[[edges]]
from = { node = "generation", port = "change_set" }
to = { node = "architecture", port = "change_set" }

[[edges]]
from = { node = "generation", port = "findings" }
to = { node = "performance", port = "prior_findings" }

[[edges]]
from = { node = "generation", port = "change_set" }
to = { node = "performance", port = "change_set" }

[[edges]]
from = { node = "gate", port = "decision" }
to = { node = "architecture", port = "gate" }

[[edges]]
from = { node = "gate", port = "decision" }
to = { node = "performance", port = "gate" }

[[edges]]
from = { node = "architecture", port = "result" }
to = { node = "gather", port = "architecture" }

[[edges]]
from = { node = "performance", port = "result" }
to = { node = "gather", port = "performance" }

[[edges]]
from = { node = "gather", port = "reports" }
to = { node = "ledger", port = "reports" }

# -------------------------------------------------------------------- budgets
# Defaults, in tokens; the numbers are this pipeline's to override. A run that exhausts
# finishes in-flight attempts and reports incomplete; a fenced attempt charges.
[budgets]
unit = "tokens"
attempt = 300000
run = 2000000

# ---------------------------------------------------------------- convergence
[convergence]
clean_rounds = 2
max_rounds = 4
gate = "major"
