[profile.default]
# Bound a bare nextest run on a shared host. `make test` passes `TEST_THREADS` explicitly.
test-threads = 4
slow-timeout = { period = "120s" }

[profile.ci]
# One test per process, scheduled across every test binary at once (ADR-0124). `make test`
# passes `TEST_THREADS`: four on a four-core CI runner, half the cores on a developer machine.
# These tests spawn real process trees, so the host CPU count itself is not a suitable bound.
test-threads = 4
retries = 0
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

# Tests that assert against a fixed real-time budget or measure real elapsed time run alone:
# nothing else is scheduled while they hold every test thread. That keeps them honest under any
# thread count instead of throttling the whole suite to protect them. Highest priority runs them
# first. Only such tests belong here (ADR-0124), each for the reason beside it:
# - identity_rechecks_cancel_an_inflight_status_process: its observer must see the status
#   process inside a 20 s window, before the probe's 30 s deadline would end it instead.
# - codex_subscription_probe_reaps_descendants_after_an_early_exit: the probe's descendant must
#   be gone within a 2 s window (100 polls of 20 ms).
# - setup_repairs_auth_directory_and_lock_modes_under_a_restrictive_umask: its work takes
#   0.37 s run directly on a 14-core macOS host, but run first and alone it pays the first launch
#   of a freshly linked `af`, which macOS assesses before it runs (11.2 s measured straight after
#   relinking), and every Task gate starts from a fresh build. Taken out of this override, that
#   cost lands on whichever parallel test launches `af` first, under the 15 s provider status
#   probe deadline. In a before/after bench (one warm-up, then three alternating full-suite runs
#   per side, 7 threads, 14-core macOS), one of three runs without it here failed it and
#   status_keeps_a_default_context_whose_status_probe_failed with "provider status probe timed
#   out after 15 seconds"; no run with it here failed. Its gain outside was about 1.3 s.
# - typed_reply_never_falls_back_and_failed_outputs_keep_accounting: every case runs the
#   adapter under a 5 s worker deadline.
# - light_cache_candidate_measures_real_latency_and_grounds_later_adoption_evidence: measures
#   the 8-trial latency comparison against a baseline that sleeps 3 s, plus the phases that
#   follow it on the same repository and Store: those that read that comparison's Task and the
#   unknown-toolchain comparison after it. Every other light-strategy phase measures nothing and
#   runs in parallel in one test, light_strategy_generates_one_candidate_without_exposing_*.
#   Run alone on a 14-core macOS host (median of three), the pair takes 45.5 s + 19.8 s against
#   60.3 s for the single test it replaces. With E the exclusive seconds and S the sum, the
#   expected wall time E*(T-1)/T + S/T is 50.5 s at 4 threads and 48.3 s at 7 (60.3 s single).
# - af_help_and_af_project_help_answer_in_under_50_ms: the fastest of ten launches of `af --help`
#   and of `af project --help` must answer in under 50 ms (ADR-0158); about 5 ms run directly on
#   a 14-core macOS host.
# - authority_instances_at_both_package_sizes_pass_the_oracle: each setup write of the 8-MiB
#   author package (propose, then admit) must finish inside its own production 15 s Task lease,
#   and each replays and revalidates that envelope two or three times. On the loaded gate one
#   admission took 14.5 s; with ten probe tests beside it on a 14-core macOS host (load about
#   90) one write ran past its lease and was reported lease_expired, as the Store must. Run
#   alone at load 60-80 from other processes it passed in 116 s (ADR-0182).
# - heavy_review_cannot_erase_stale_claims and heavy_review_cannot_erase_rediscovered_claims:
#   eleven Attempts, each a Python Worker given its 5 s Attempt wall from reservation, under one
#   15 s heartbeat lease. On the loaded gate a reviewer was left 377 ms of its wall after its
#   preparation and was killed, and a heartbeat renewal through its own connection, made while a
#   Store operation held the shared one into the lease's last 4 s, cost the next write its
#   sequence comparison; both are the kernel's correct answers to a real-time budget the
#   fixture spent on scheduling. Alone the two pass together in 25 s (ADR-0182).
# - concurrent_short_commands_complete_within_their_real_time_bounds: the real-time half of
#   review-process's concurrent pipes test (its pipe-independence half runs in parallel under a
#   load-safe timeout): twelve threads start /bin/sh together 24 times, and every short command
#   must answer inside its 100 ms timeout, every command be done within 2 s and the whole run
#   within 10 s. On the loaded gate a shell that answers took longer than 100 ms to start.
# - heavy_starter_repair_uses_current_evidence: the same eleven-Attempt shape, with 5 s
#   Workers and a 15 s heartbeat lease. It passed alone in 30.38 s but took 92.2 s in the
#   full gate and exhausted resources at repair verification. Hold the suite's threads as
#   the heavy-review fixtures do; this is suite exclusivity, not machine isolation (ADR-0202).
# - targeted_starter_repair_uses_current_evidence: the same 5 s Python Workers and 15 s
#   heartbeat lease. It passed alone in 19.385 s but took 27.888 s in the full gate and
#   exhausted resources at repair verification. Preserve those budgets and execute it with
#   the suite's threads held, alongside heavy starter repair (ADR-0203).
# The guarded kernel measurement is manual (`make perf-kernel-measure`).
# Its refusal half runs in the ordinary perf class without exclusivity (ADR-0252).
[[profile.default.overrides]]
filter = '''
test(/::identity_rechecks_cancel_an_inflight_status_process$/)
| test(/::codex_subscription_probe_reaps_descendants_after_an_early_exit$/)
| test(/::setup_repairs_auth_directory_and_lock_modes_under_a_restrictive_umask$/)
| test(/typed_reply_never_falls_back_and_failed_outputs_keep_accounting$/)
| test(/light_cache_candidate_measures_real_latency_and_grounds_later_adoption_evidence$/)
| test(/::af_help_and_af_project_help_answer_in_under_50_ms$/)
| test(/authority_instances_at_both_package_sizes_pass_the_oracle$/)
| test(/::heavy_review_cannot_erase_stale_claims$/)
| test(/::heavy_review_cannot_erase_rediscovered_claims$/)
| test(/::heavy_starter_repair_uses_current_evidence$/)
| test(/::targeted_starter_repair_uses_current_evidence$/)
| test(/concurrent_short_commands_complete_within_their_real_time_bounds$/)
'''
threads-required = "num-test-threads"
priority = 100
