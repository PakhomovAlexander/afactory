[profile.ci]
# One test per process, scheduled across every test binary at once (ADR-0124). The thread
# count comes from `make test` (`TEST_THREADS`): four on a four-core CI runner, half the
# cores on a developer machine. These tests spawn real process trees, so the host CPU count
# itself is not a suitable bound.
test-threads = 4
retries = 0
fail-fast = false
slow-timeout = { period = "120s" }

[profile.ci.junit]
path = "junit.xml"

# Tests that assert against a fixed real-time budget or measure real elapsed time run alone:
# nothing else is scheduled while they hold every test thread. That keeps them honest under any
# thread count instead of throttling the whole suite to protect them. Highest priority runs them
# first. Only such tests belong here (ADR-0124), each for the reason beside it:
# - identity_rechecks_cancel_an_inflight_status_process: its observer must see the status
#   process inside a 20 s window, before the probe's 30 s deadline would end it instead.
# - codex_subscription_probe_reaps_descendants_after_an_early_exit: the probe's descendant must
#   be gone within a 2 s window (100 polls of 20 ms).
# - setup_repairs_auth_directory_and_lock_modes_under_a_restrictive_umask: its work takes
#   0.37 s run directly on a 14-core macOS host, but run first and alone it pays the first launch
#   of a freshly linked `af`, which macOS assesses before it runs (11.2 s measured straight after
#   relinking), and every Task gate starts from a fresh build. Taken out of this override, that
#   cost lands on whichever parallel test launches `af` first, under the 15 s provider status
#   probe deadline. In a before/after bench (one warm-up, then three alternating full-suite runs
#   per side, 7 threads, 14-core macOS), one of three runs without it here failed it and
#   status_keeps_a_default_context_whose_status_probe_failed with "provider status probe timed
#   out after 15 seconds"; no run with it here failed. Its gain outside was about 1.3 s.
# - typed_reply_never_falls_back_and_failed_outputs_keep_accounting: every case runs the
#   adapter under a 5 s worker deadline.
# - light_cache_candidate_measures_real_latency_and_grounds_later_adoption_evidence: measures
#   the 8-trial latency comparison against a baseline that sleeps 3 s, plus the phases that
#   follow it on the same repository and Store: those that read that comparison's Task and the
#   unknown-toolchain comparison after it. Every other light-strategy phase measures nothing and
#   runs in parallel in one test, light_strategy_generates_one_candidate_without_exposing_*.
#   Run alone on a 14-core macOS host (median of three), the pair takes 45.5 s + 19.8 s against
#   60.3 s for the single test it replaces. With E the exclusive seconds and S the sum, the
#   expected wall time E*(T-1)/T + S/T is 50.5 s at 4 threads and 48.3 s at 7 (60.3 s single).
[[profile.ci.overrides]]
filter = '''
test(/::identity_rechecks_cancel_an_inflight_status_process$/)
| test(/::codex_subscription_probe_reaps_descendants_after_an_early_exit$/)
| test(/::setup_repairs_auth_directory_and_lock_modes_under_a_restrictive_umask$/)
| test(/typed_reply_never_falls_back_and_failed_outputs_keep_accounting$/)
| test(/light_cache_candidate_measures_real_latency_and_grounds_later_adoption_evidence$/)
'''
threads-required = "num-test-threads"
priority = 100
