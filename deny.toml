# cargo-deny: `cargo deny check advisories bans sources`, which .github/workflows/deny.yml runs
# every week and on demand. Advisories are the RustSec database; bans refuse a second version of
# a crate unless it is listed below with why; sources admit crates.io only.

[graph]
all-features = true

[advisories]
# Every advisory refuses, unmaintained and unsound crates included; an exception is named here
# with its reason, never silenced in the workflow.
yanked = "deny"
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Workspace crates depend on each other by path.
allow-wildcard-paths = true
# The duplicates the dependency tree has today, each pulled in by a dependency that has not
# moved to the newer major yet. A new duplicate fails the check until it is listed or removed.
# sha2 0.10 is not listed: it reaches the tree only through the `minisign` test dependency's
# scrypt, which cargo-deny does not encounter.
skip = [
  { crate = "nix@0.28.0", reason = "portable-pty pins nix 0.28; af itself uses 0.31" },
  { crate = "cfg_aliases@0.1.1", reason = "nix 0.28's build dependency" },
  { crate = "bitflags@1.3.2", reason = "portable-pty" },
  { crate = "thiserror@1.0.69", reason = "portable-pty's filedescriptor; the workspace uses 2" },
  { crate = "thiserror-impl@1.0.69", reason = "thiserror 1, as above" },
  { crate = "getrandom@0.3.4", reason = "jsonschema's ahash" },
  { crate = "r-efi@5.3.0", reason = "getrandom 0.3, as above" },
  { crate = "num-bigint@0.4.8", reason = "jsonschema's fraction" },
  { crate = "hashbrown@0.16.1", reason = "sqlite-wasm-rs's rsqlite-vfs" },
  { crate = "windows-sys@0.60.2", reason = "notify, on Windows targets only" },
  { crate = "syn@2.0.119", reason = "strum_macros and other proc-macro dependencies are on syn 2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
