name: Private release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build
        run: cargo build --release --locked --bin af
      - name: Plan consumer fixtures with the built binary
        shell: bash
        run: fixtures/consumers/check.sh target/release/af
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          archive="af-${GITHUB_REF_NAME}-${host}.tar.gz"
          # The archive: the binary at its root (what `af self` and install.sh expect), plus
          # completions and man pages rendered by that very binary so they cannot drift.
          rm -rf dist && mkdir -p dist/completions dist/man
          cp target/release/af dist/af
          for shell in bash zsh fish elvish powershell; do
            AF_SELF_OFFLINE=1 target/release/af completions "$shell" > "dist/completions/af.$shell"
          done
          AF_SELF_OFFLINE=1 target/release/af self man dist/man
          tar -czf "$archive" -C dist af completions man
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          gh release upload "$GITHUB_REF_NAME" "$archive" "$archive.sha256" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Assemble SHA256SUMS and the installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p sums
          gh release download "$GITHUB_REF_NAME" --pattern '*.sha256' --dir sums
          cat sums/*.sha256 > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS install.sh --clobber
      - name: Publish completed draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
