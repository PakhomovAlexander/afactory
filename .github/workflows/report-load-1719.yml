name: Report lock load evidence1719
on:
  push:
    branches: ["af-gate/review-1719/report-load"]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: /tmp/report-load-1719-target
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: '-C link-arg=-fuse-ld=lld'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      - uses: ./.github/actions/cargo-cache
      - run: bash scripts/install-nextest.sh
      - run: sudo apt-get install -y --no-install-recommends lld stress-ng
      - name: Build diagnostic test remotely
        run: |
          mkdir -p "$RUNNER_TEMP/load-evidence"
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/load-evidence/source.txt"
          git status --porcelain
          cargo test --locked -p review-pipeline --test it --no-run
      - name: Bounded baseline and real make-check contention
        run: timeout --signal=TERM --kill-after=20s 2400 bash scripts/report-load-1719.sh
      - name: Retain raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-load-1719
          path: ${{ runner.temp }}/load-evidence
      - name: Verify no source mutation
        if: always()
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
