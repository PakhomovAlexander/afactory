name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default: checkout's persisted token then cannot push, tag, or publish from
# code a pull request brought in. The release workflow scopes its own write permission to the
# two jobs that tag and publish.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Check
        run: make check
      - name: CLI smoke
        run: cargo run --locked -p reviewctl --bin af -- --version
      - name: Installer test, signature path (minisign fetched by digest)
        run: MINISIGN="$(scripts/fetch-minisign.sh "$RUNNER_TEMP/minisign")" make installer-test-signed

  container-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Verify container runtime
        run: docker info
      - name: Run live container probes
        run: make review-kernel-container-probes
