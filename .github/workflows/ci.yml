name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Keep line tables for test failures without duplicating full debug information in every
    # integration-test binary. One-shot CI builds do not benefit from incremental object caches.
    env:
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_TEST_DEBUG: 1
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A failed test still leaves valid compiled dependencies; keep them for the next push.
          cache-on-failure: true
          # Workspace crates are the bulk of the rebuild; cargo's fingerprints keep them correct.
          cache-workspace-crates: true
      - name: Check
        run: make check
      - name: CLI smoke
        run: cargo run --locked -p reviewctl --bin af -- --version

  container-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A failed test still leaves valid compiled dependencies; keep them for the next push.
          cache-on-failure: true
          # Workspace crates are the bulk of the rebuild; cargo's fingerprints keep them correct.
          cache-workspace-crates: true
      - name: Verify container runtime
        run: docker info
      - name: Run live container probes
        run: make review-kernel-container-probes
