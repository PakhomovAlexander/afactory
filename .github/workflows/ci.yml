name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default: checkout's persisted token then cannot push, tag, or publish from
# code a pull request brought in. The release workflow scopes its own write permission to the
# two jobs that tag and publish.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Check
        run: make check
      - name: CLI smoke
        run: cargo run --locked -p reviewctl --bin af -- --version
      - name: Fetch the pinned minisign
        # Its own step, as in release.yml: a failing command substitution in an assignment
        # *prefix* does not abort under `bash -eo pipefail`, so the fetch's exit status was
        # discarded and installer-test.sh fell back to `command -v minisign` — bypassing the
        # digest pin the day a runner image ships one.
        id: minisign
        shell: bash
        run: |
          set -euo pipefail
          echo "bin=$(scripts/fetch-minisign.sh "$RUNNER_TEMP/minisign")" >> "$GITHUB_OUTPUT"
      - name: Installer test, signature path (minisign fetched by digest)
        shell: bash
        env:
          MINISIGN: ${{ steps.minisign.outputs.bin }}
        run: |
          set -euo pipefail
          [[ -x "$MINISIGN" ]] || { echo "no verified minisign at '$MINISIGN'"; exit 1; }
          make installer-test-signed

  # markdownlint is enforced here, where the network exists. The review pipeline's Gate runs the
  # same script advisorily (.af/pipelines/review.toml): `npm ci` has no offline path, so a
  # required Check that cannot install its toolchain would lose the Round with no reviewer.
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: markdownlint over **/*.md, from the pinned toolchain in tools/markdownlint/
        run: make markdownlint

  container-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Verify container runtime
        run: docker info
      - name: Run live container probes
        run: make review-kernel-container-probes
