name: Review1727 exact source gates
on:
  push:
    branches: ["af-gate/review-1727/executor"]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b6dade434cdea6928cbd9370be68b2b67e803c2e
          persist-credentials: false
      - name: Verify exact source
        run: |
          test "$(git rev-parse HEAD)" = b6dade434cdea6928cbd9370be68b2b67e803c2e
          test "$(git rev-parse HEAD^{tree})" = 1cd4bc50b81246734e0e394e2f01738e2f5b9f52
          test -z "$(git status --porcelain)"
          echo 'REVIEW1727 base=5ab2fd6420d4c7ddab8867e321d53bec99b2e44d head=b6dade434cdea6928cbd9370be68b2b67e803c2e tree=1cd4bc50b81246734e0e394e2f01738e2f5b9f52'
      - name: Install pinned Rust
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      - uses: ./.github/actions/cargo-cache
      - name: Install pinned test runner
        run: bash scripts/install-nextest.sh
      - name: Install linker
        run: sudo apt-get install -y --no-install-recommends lld
      - name: Required markdownlint
        run: npx --yes markdownlint-cli2@0.22.1 '**/*.md'
      - name: Required kernel-verify
        env:
          CARGO_INCREMENTAL: 0
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: '-C link-arg=-fuse-ld=lld'
          AF_GATE_TARGET_DIR: ${{ runner.temp }}/review1727-target
        run: bash scripts/verify.sh
      - name: Verify unchanged source
        run: |
          git status --porcelain
          git diff --stat
          test "$(git rev-parse HEAD)" = b6dade434cdea6928cbd9370be68b2b67e803c2e
          test -z "$(git status --porcelain)"
