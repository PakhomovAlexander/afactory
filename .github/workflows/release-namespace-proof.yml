name: Release namespace proof

on:
  pull_request:
    paths:
      - '.github/workflows/release-namespace-proof.yml'
      - '.github/workflows/release.yml'
      - 'scripts/prepare-linux-release-smoke.sh'
      - 'scripts/performance/perflab/account_isolation.py'
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove the release runner's private account namespace
        run: bash scripts/prepare-linux-release-smoke.sh
