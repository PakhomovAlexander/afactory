# One definition for PR checks, main checks and tagged release checks.
name: Validate

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 1
  CARGO_PROFILE_TEST_DEBUG: 1
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.release && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - uses: ./.github/actions/cargo-cache
        id: cargo-cache
        with:
          kind: check-debug1
      - name: Check
        env:
          AF_CI_METRICS: ${{ runner.temp }}/check-metrics.jsonl
        run: make check
      - name: CLI smoke
        run: python3 scripts/ci-step.py cli-smoke cargo run --locked -p af --bin af -- --version
        env:
          AF_CI_METRICS: ${{ runner.temp }}/check-metrics.jsonl
      - name: Save Cargo cache
        if: always() && !cancelled()
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          primary-key: ${{ steps.cargo-cache.outputs.primary-key }}
          matched-key: ${{ steps.cargo-cache.outputs.matched-key }}
      - name: Retain timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/cache-metrics.json
            ${{ runner.temp }}/check-metrics.jsonl
          if-no-files-found: warn

  container-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: ./.github/actions/cargo-cache
        id: cargo-cache
        with:
          kind: container-debug1
      - name: Verify container runtime
        run: docker info
      - name: Run live container probes
        run: python3 scripts/ci-step.py container-probes make review-kernel-container-probes
        env:
          AF_CI_METRICS: ${{ runner.temp }}/container-metrics.jsonl
      - name: Save Cargo cache
        if: always() && !cancelled()
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          primary-key: ${{ steps.cargo-cache.outputs.primary-key }}
          matched-key: ${{ steps.cargo-cache.outputs.matched-key }}
      - name: Retain timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-metrics
          path: |
            ${{ runner.temp }}/container-metrics.jsonl
            ${{ runner.temp }}/cache-metrics.json
          if-no-files-found: warn
