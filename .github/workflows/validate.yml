# One definition for PR checks, main checks and tagged release checks.
name: Validate

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  # Compiled crates are cached per rustc invocation, keyed by their inputs, so an unchanged
  # crate is a hit on any later commit (ADR-0124). The cache action keeps only the registry.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  # Formatting and clippy run beside the tests rather than before them; the release-only
  # macOS leg keeps the whole gate because clippy sees macOS-only code there and nowhere else.
  lint:
    name: lint
    # The required `lint` check carries the performance laboratory's Python 3.9 and 3.11+ legs,
    # which are not required checks themselves. It runs whatever their outcome and fails first
    # unless every leg succeeded, so a failed, cancelled or skipped leg never leaves this check
    # green or skipped (ADR-0162).
    needs: performance-python
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the performance lab on every supported Python
        env:
          PERFORMANCE_PYTHON: ${{ needs.performance-python.result }}
        run: |
          if [ "$PERFORMANCE_PYTHON" != "success" ]; then
            echo "performance lab (python 3.9, 3.11, 3.13) finished '$PERFORMANCE_PYTHON', not 'success'" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: ./.github/actions/cargo-cache
        id: cargo-cache
      - name: Format and lint
        env:
          AF_CI_METRICS: ${{ runner.temp }}/lint-metrics.jsonl
        run: make fmt lint
      - name: Compile cache statistics
        if: always()
        run: sccache --show-stats
      - name: Save Cargo cache
        if: always() && !cancelled()
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          primary-key: ${{ steps.cargo-cache.outputs.primary-key }}
          matched-key: ${{ steps.cargo-cache.outputs.matched-key }}
      - name: Retain timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/cache-metrics.json
            ${{ runner.temp }}/lint-metrics.jsonl
          if-no-files-found: warn

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.release && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: ./.github/actions/cargo-cache
        id: cargo-cache
      - name: Install the pinned test runner
        run: bash scripts/install-nextest.sh
      - name: Link with lld
        # The test executables link far faster with lld than with GNU ld; macOS keeps Apple's
        # linker. The flag is scoped to this target so it never reaches a release build, which
        # links its static Linux targets through zig.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends lld
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=lld' >> "$GITHUB_ENV"
      - name: Check
        env:
          AF_CI_METRICS: ${{ runner.temp }}/check-metrics.jsonl
        # Linux formats and lints in the parallel `lint` job; the release-only macOS leg runs
        # the whole gate.
        run: make ${{ runner.os == 'macOS' && 'check' || 'preflight-check test release-check' }}
      - name: CLI smoke
        run: python3 scripts/ci-step.py cli-smoke cargo run --locked -p af --bin af -- --version
        env:
          AF_CI_METRICS: ${{ runner.temp }}/check-metrics.jsonl
      - name: Compile cache statistics
        if: always()
        run: sccache --show-stats
      - name: Save Cargo cache
        if: always() && !cancelled()
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          primary-key: ${{ steps.cargo-cache.outputs.primary-key }}
          matched-key: ${{ steps.cargo-cache.outputs.matched-key }}
      - name: Retain timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/cache-metrics.json
            ${{ runner.temp }}/check-metrics.jsonl
            target/nextest/ci/junit.xml
          if-no-files-found: warn

  # The performance laboratory supports Python 3.9 and 3.11+ (ADR-0162). On 3.11+ its tests
  # also prove that the vendored Tomli and the standard library's tomllib read every registry
  # identically; AF_PERF_REQUIRE_TOMLLIB turns that check from a skip into a failure there.
  # The required `lint` job depends on this matrix and fails unless it succeeded.
  performance-python:
    name: performance lab (python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            tomllib: ""
          - python: "3.11"
            tomllib: "1"
          - python: "3.13"
            tomllib: "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Laboratory tests and schema parity
        env:
          AF_CI_METRICS: ${{ runner.temp }}/performance-metrics.jsonl
          AF_PERF_REQUIRE_TOMLLIB: ${{ matrix.tomllib }}
        run: |
          python scripts/ci-step.py performance-lab python scripts/test-performance.py
          python scripts/ci-step.py performance-schemas python scripts/performance/schemas.py

  container-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: ./.github/actions/cargo-cache
        id: cargo-cache
      - name: Link with lld
        run: |
          sudo apt-get install -y --no-install-recommends lld
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=lld' >> "$GITHUB_ENV"
      - name: Verify container runtime
        run: docker info
      - name: Run live container probes
        run: python3 scripts/ci-step.py container-probes make review-kernel-container-probes
        env:
          AF_CI_METRICS: ${{ runner.temp }}/container-metrics.jsonl
      - name: Compile cache statistics
        if: always()
        run: sccache --show-stats
      - name: Save Cargo cache
        if: always() && !cancelled()
        uses: ./.github/actions/cargo-cache
        with:
          mode: save
          primary-key: ${{ steps.cargo-cache.outputs.primary-key }}
          matched-key: ${{ steps.cargo-cache.outputs.matched-key }}
      - name: Retain timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-metrics
          path: |
            ${{ runner.temp }}/container-metrics.jsonl
            ${{ runner.temp }}/cache-metrics.json
          if-no-files-found: warn
