name: Cargo cache
description: Revision-fresh Cargo artifacts; validation always executes after restoration.
inputs:
  kind:
    description: Build profile and target/tool identity
    default: check-debug1
  mode:
    description: Restore before compilation or save even after a failed test
    default: restore
  primary-key:
    description: Exact key returned by restore
    default: ''
  matched-key:
    description: Restored key, empty on a miss
    default: ''
outputs:
  primary-key:
    value: ${{ steps.restore.outputs.cache-primary-key }}
    description: Exact revision key
  matched-key:
    value: ${{ steps.restore.outputs.cache-matched-key }}
    description: Restored key
runs:
  using: composite
  steps:
    - name: Restore Cargo artifacts
      id: restore
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/registry/src/
          ~/.cargo/git/db/
          target/
        key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-rust1.88-${{ inputs.kind }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
        restore-keys: |
          cargo-v1-${{ runner.os }}-${{ runner.arch }}-rust1.88-${{ inputs.kind }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}-
    - name: Record cache outcome
      if: inputs.mode == 'restore'
      shell: bash
      env:
        PRIMARY_KEY: ${{ steps.restore.outputs.cache-primary-key }}
        MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        if [[ -z "$MATCHED_KEY" ]]; then outcome=miss
        elif [[ "$PRIMARY_KEY" == "$MATCHED_KEY" ]]; then outcome=exact
        else outcome=compatible
        fi
        echo "Cargo cache: $outcome" >> "$GITHUB_STEP_SUMMARY"
        printf '{"schema":"af.ci-cache/1","outcome":"%s","primary_key":"%s","matched_key":"%s"}\n' \
          "$outcome" "$PRIMARY_KEY" "$MATCHED_KEY" > "$RUNNER_TEMP/cache-metrics.json"
    - name: Save current Cargo artifacts
      if: inputs.mode == 'save' && inputs.primary-key != '' && inputs.primary-key != inputs.matched-key
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/registry/src/
          ~/.cargo/git/db/
          target/
        key: ${{ inputs.primary-key }}
