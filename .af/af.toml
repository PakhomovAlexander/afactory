version = 1

[project]
name = "afactory"
min_af = "0.2"

[defaults]
pipeline = "review"
task_pipeline = "implement"

[worker.correctness]
package = "correctness"

[worker.implementer]
package = "implementer"

[worker.evaluator]
package = "evaluator"

# The audit pipeline's specialists (`.af/pipelines/audit.toml`, run with --pipeline).
[worker.architecture]
package = "architecture"

[worker.tests]
package = "tests"

[worker.bugs]
package = "bugs"

[worker.performance]
package = "performance"
