# Design-note review: one bug-bounty reviewer (GPT-6-Sol/xhigh) over a diff Subject, with the
# markdown Gate only. This is the documented cheap-iteration path (docs/non-goals.md): a separate
# pipeline with one reviewer, its own budgets, its own Campaign and its own Ledger. Bind at run
# time, for example `--provider design=codex-main`.

version = 2
check_timeout_seconds = 600

[subject]
kind = "diff"

[[checks]]
name = "markdownlint"
program = "npx"
args = [{ value = "--yes" }, { value = "markdownlint-cli2@0.22.1" }, { value = "**/*.md" }]

[[nodes]]
id = "gate"
kind = "gate"
outputs = [{ name = "decision", type = "review.kernel/GateDecision@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]

[[nodes]]
id = "generation"
kind = "generation"
outputs = [{ name = "findings", type = "review.kernel/FindingSet@1", cardinality = "one", optional = true, snapshot_affinity = "any" }, { name = "change_set", type = "review.kernel/ChangeSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]

[[nodes]]
id = "design"
kind = "reviewer"
inputs = [{ name = "gate", type = "review.kernel/GateDecision@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }, { name = "prior_findings", type = "review.kernel/FindingSet@1", cardinality = "one", optional = true, snapshot_affinity = "any" }, { name = "change_set", type = "review.kernel/ChangeSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]
outputs = [{ name = "result", type = "review.kernel/ReviewerResult@2", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]
gated_by = "gate"
package = "bugs-xhigh"
demands = "required"

[[nodes]]
id = "gather"
kind = "gather"
inputs = [{ name = "design", type = "review.kernel/ReviewerResult@2", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]
outputs = [{ name = "reports", type = "review.kernel/ReportSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]

[[nodes]]
id = "ledger"
kind = "ledger"
inputs = [{ name = "reports", type = "review.kernel/ReportSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]
outputs = [{ name = "findings", type = "review.kernel/FindingSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }, { name = "demands", type = "review.kernel/DemandSet@1", cardinality = "one", optional = false, snapshot_affinity = "same_subject" }]

[[edges]]
from = { node = "generation", port = "findings" }
to = { node = "design", port = "prior_findings" }

[[edges]]
from = { node = "generation", port = "change_set" }
to = { node = "design", port = "change_set" }

[[edges]]
from = { node = "gate", port = "decision" }
to = { node = "design", port = "gate" }

[[edges]]
from = { node = "design", port = "result" }
to = { node = "gather", port = "design" }

[[edges]]
from = { node = "gather", port = "reports" }
to = { node = "ledger", port = "reports" }

[budgets]
unit = "tokens"
attempt = 400000
run = 1000000

[convergence]
clean_rounds = 1
max_rounds = 2
gate = "major"
