schema = "af.pipeline/6"
name = "bugfix/primitive-codex"
version = "1.0.0"
max_attempts = 16
max_parallel = 3

[contract.inputs.findings]
artifact_type = "af/TaskReviewFindings@1"
cardinality = "one"
optional = true
covers = []

[contract.inputs.findings.affinity]
kind = "unbound"

[contract.inputs.history]
artifact_type = "af/ReviewHistory@1"
cardinality = "one"
optional = false
root_default = "empty_review_history"
covers = []

[contract.inputs.history.affinity]
kind = "unbound"

[contract.inputs.requirements]
artifact_type = "af/Requirements@1"
cardinality = "one"
optional = false
covers = []

[contract.inputs.requirements.affinity]
kind = "unbound"

[contract.inputs.source]
artifact_type = "af/SourceTree@1"
cardinality = "one"
optional = false
covers = []

[contract.inputs.source.affinity]
kind = "unbound"

[contract.outputs.evaluation]
artifact_type = "af/VerificationResult@1"
cardinality = "one"
optional = false
covers = ["goal"]

[contract.outputs.evaluation.affinity]
kind = "derived_from"
input = "source"

[contract.outputs.snapshot]
artifact_type = "af/SourceTree@1"
cardinality = "one"
optional = false
covers = []

[contract.outputs.snapshot.affinity]
kind = "derived_from"
input = "source"

[contract.outputs.verification]
artifact_type = "af/ReviewedImplementation@1"
cardinality = "one"
optional = false
covers = ["verified"]

[contract.outputs.verification.affinity]
kind = "derived_from"
input = "source"

[accepts]
kinds = ["implement"]

[accepts.required_facts]
standard = true

[slots.bugs]
worker = "issue-internal/primitive-bugs"
role = "review"
input_type = "af/ReviewInput@2"
output_type = "review.kernel/ReviewerResult@2"
min_attempts = 1
# A reply that does not parse, or a refused one, gets one more Attempt (issue #283).
max_attempts = 2
allow_local_replacement = false
independent_from = ["implementer"]

[slots.correctness]
worker = "issue-internal/primitive-correctness"
role = "review"
input_type = "af/ReviewInput@2"
output_type = "review.kernel/ReviewerResult@2"
min_attempts = 1
# A reply that does not parse, or a refused one, gets one more Attempt (issue #283).
max_attempts = 2
allow_local_replacement = false
independent_from = ["implementer"]

[slots.evaluator]
worker = "issue-internal/primitive-evaluator"
role = "evaluate"
input_type = "af/ImplementationEvaluationInput@1"
output_type = "af/TaskEvaluation@1"
min_attempts = 1
# A reply that does not parse, or a refused one, gets one more Attempt (issue #283).
max_attempts = 2
allow_local_replacement = false
independent_from = ["implementer"]

[slots.implementer]
worker = "issue-internal/primitive-implementer"
role = "implement"
input_type = "af/ImplementationInput@2"
output_type = "af/ImplementationReport@1"
min_attempts = 1
max_attempts = 1
allow_local_replacement = false
independent_from = []

[[nodes]]
id = "implement"

[nodes.operator]
op = "worker"
slot = "implementer"

[nodes.inputs.findings]
kind = "input"
port = "findings"

[nodes.inputs.requirements]
kind = "input"
port = "requirements"

[nodes.inputs.source]
kind = "input"
port = "source"

[nodes.inputs.research_report]
kind = "input"
port = "research_report"

[[nodes]]
id = "seal"

[nodes.operator]
op = "seal"

[nodes.inputs.candidate]
kind = "node"
node = "implement"
port = "candidate"

[[nodes]]
id = "review"

[nodes.operator]
op = "call"
pipeline = "issue-internal/primitive-review"

[nodes.operator.bindings]
evaluator = "evaluator"
bugs = "bugs"
correctness = "correctness"

[nodes.inputs.base]
kind = "input"
port = "source"

[nodes.inputs.history]
kind = "input"
port = "history"

[nodes.inputs.requirements]
kind = "input"
port = "requirements"

[nodes.inputs.source]
kind = "node"
node = "seal"
port = "snapshot"

[[nodes]]
id = "accept"

[nodes.operator]
op = "review_accept"

[nodes.inputs.checks]
kind = "node"
node = "review"
port = "checks"

[nodes.inputs.review]
kind = "node"
node = "review"
port = "review"

[nodes.inputs.source]
kind = "node"
node = "seal"
port = "snapshot"

[[nodes]]
id = "final_checks"

[nodes.operator]
op = "select"

[nodes.inputs.condition]
kind = "node"
node = "accept"
port = "result"

[nodes.inputs.failed]
kind = "node"
node = "review"
port = "checks"

[nodes.inputs.inconclusive]
kind = "node"
node = "review"
port = "checks"

[nodes.inputs.passed]
kind = "node"
node = "review"
port = "checks"

[[nodes]]
id = "accept_goal"

[nodes.operator]
op = "accept"

[nodes.inputs.checks]
kind = "node"
node = "final_checks"
port = "output"

[nodes.inputs.evaluation]
kind = "node"
node = "review"
port = "evaluation"

[nodes.inputs.source]
kind = "node"
node = "accept"
port = "snapshot"

[outputs.evaluation]
kind = "node"
node = "accept_goal"
port = "result"

[outputs.snapshot]
kind = "node"
node = "accept"
port = "snapshot"

[outputs.verification]
kind = "node"
node = "accept"
port = "result"

[coverage.goal]
kind = "node"
node = "accept_goal"
port = "result"

[coverage.verified]
kind = "node"
node = "accept"
port = "result"

[contract.inputs.research_report]
artifact_type = "af/Document@1"
cardinality = "one"
optional = true
covers = []

[contract.inputs.research_report.affinity]
kind = "unbound"

[contract.outputs.testing]
artifact_type = "af/ImplementationTestEvidence@1"
cardinality = "one"
optional = true
covers = []
[contract.outputs.testing.affinity]
kind = "derived_from"
input = "source"
[outputs.testing]
kind = "node"
node = "review"
port = "testing"
