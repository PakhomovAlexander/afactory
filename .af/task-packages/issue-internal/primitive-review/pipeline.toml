schema = "af.pipeline/6"
name = "issue-internal/primitive-review"
version = "1.0.0"
max_attempts = 8
max_parallel = 3

[contract.inputs.base]
artifact_type = "af/SourceTree@1"
cardinality = "one"
optional = true
covers = []

[contract.inputs.base.affinity]
kind = "unbound"

[contract.inputs.continuation]
artifact_type = "af/TaskReviewContinuation@1"
cardinality = "one"
optional = true
covers = []

[contract.inputs.continuation.affinity]
kind = "same_as"
input = "source"

[contract.inputs.history]
artifact_type = "af/ReviewHistory@1"
cardinality = "one"
optional = false
root_default = "empty_review_history"
covers = []

[contract.inputs.history.affinity]
kind = "unbound"

[contract.inputs.requirements]
artifact_type = "af/Requirements@1"
cardinality = "one"
optional = false
covers = []

[contract.inputs.requirements.affinity]
kind = "unbound"

[contract.inputs.source]
artifact_type = "af/SourceTree@1"
cardinality = "one"
optional = false
covers = []

[contract.inputs.source.affinity]
kind = "unbound"

[contract.outputs.checks]
artifact_type = "af/TaskCheckReceipt@2"
cardinality = "one"
optional = false
covers = []

[contract.outputs.checks.affinity]
kind = "same_as"
input = "source"

[contract.outputs.findings]
artifact_type = "af/TaskReviewClaims@1"
cardinality = "one"
optional = false
covers = []

[contract.outputs.findings.affinity]
kind = "same_as"
input = "source"

[contract.outputs.history]
artifact_type = "af/ReviewHistory@1"
cardinality = "one"
optional = false
covers = []

[contract.outputs.history.affinity]
kind = "unbound"

[contract.outputs.review]
artifact_type = "af/TaskReviewRound@1"
cardinality = "one"
optional = false
covers = ["reviewed"]

[contract.outputs.review.affinity]
kind = "same_as"
input = "source"

[accepts]
kinds = ["review"]

[accepts.required_facts]

[slots.bugs]
worker = "issue-internal/primitive-bugs"
role = "review"
input_type = "af/ReviewInput@2"
output_type = "review.kernel/ReviewerResult@2"
min_attempts = 1
max_attempts = 2
allow_local_replacement = false
independent_from = []

[slots.correctness]
worker = "issue-internal/primitive-correctness"
role = "review"
input_type = "af/ReviewInput@2"
output_type = "review.kernel/ReviewerResult@2"
min_attempts = 1
max_attempts = 2
allow_local_replacement = false
independent_from = []

[[nodes]]
id = "bind"

[nodes.operator]
op = "review_bind"

[nodes.inputs.base]
kind = "input"
port = "base"

[nodes.inputs.continuation]
kind = "input"
port = "continuation"

[nodes.inputs.history]
kind = "input"
port = "history"

[nodes.inputs.source]
kind = "input"
port = "source"

[[nodes]]
id = "checks"

[nodes.operator]
op = "check"
checks = ["kernel", "markdownlint"]

[nodes.inputs.source]
kind = "input"
port = "source"

[[nodes]]
id = "correctness"

[nodes.operator]
op = "verify"
slot = "correctness"

[nodes.inputs.assignment]
kind = "node"
node = "bind"
port = "correctness"

[nodes.inputs.checks]
kind = "node"
node = "checks"
port = "result"

[nodes.inputs.history]
kind = "input"
port = "history"

[nodes.inputs.requirements]
kind = "input"
port = "requirements"

[nodes.inputs.source]
kind = "input"
port = "source"

[nodes.inputs.subject]
kind = "node"
node = "bind"
port = "subject"

[nodes.when]
node = "checks"
outcome = "passed"

[[nodes]]
id = "bugs"

[nodes.operator]
op = "verify"
slot = "bugs"

[nodes.inputs.assignment]
kind = "node"
node = "bind"
port = "bugs"

[nodes.inputs.checks]
kind = "node"
node = "checks"
port = "result"

[nodes.inputs.history]
kind = "input"
port = "history"

[nodes.inputs.requirements]
kind = "input"
port = "requirements"

[nodes.inputs.source]
kind = "input"
port = "source"

[nodes.inputs.subject]
kind = "node"
node = "bind"
port = "subject"

[nodes.when]
node = "checks"
outcome = "passed"

[[nodes]]
id = "reduce"

[nodes.operator]
op = "review_reduce"

[nodes.inputs.bugs]
kind = "node"
node = "bugs"
port = "result"

[nodes.inputs.checks]
kind = "node"
node = "checks"
port = "result"

[nodes.inputs.correctness]
kind = "node"
node = "correctness"
port = "result"

[nodes.inputs.history]
kind = "input"
port = "history"

[nodes.inputs.source]
kind = "input"
port = "source"

[nodes.inputs.subject]
kind = "node"
node = "bind"
port = "subject"

[outputs.checks]
kind = "node"
node = "checks"
port = "result"

[outputs.findings]
kind = "node"
node = "reduce"
port = "findings"

[outputs.history]
kind = "node"
node = "reduce"
port = "history"

[outputs.review]
kind = "node"
node = "reduce"
port = "result"

[coverage.reviewed]
kind = "node"
node = "reduce"
port = "result"

[contract.outputs.testing]
artifact_type = "af/ImplementationTestEvidence@1"
cardinality = "one"
optional = true
covers = []
[contract.outputs.testing.affinity]
kind = "same_as"
input = "source"
[outputs.testing]
kind = "node"
node = "correctness"
port = "testing"
[contract.outputs.evaluation]
artifact_type = "af/TaskEvaluation@1"
cardinality = "one"
optional = true
covers = []
[contract.outputs.evaluation.affinity]
kind = "same_as"
input = "source"
[outputs.evaluation]
kind = "node"
node = "evaluate_goal"
port = "result"
[slots.evaluator]
worker = "issue-internal/primitive-evaluator"
role = "evaluate"
input_type = "af/ImplementationEvaluationInput@1"
output_type = "af/TaskEvaluation@1"
min_attempts = 1
max_attempts = 2
allow_local_replacement = false
independent_from = []
[[nodes]]
id = "evaluate_goal"
[nodes.operator]
op = "verify"
slot = "evaluator"
[nodes.inputs.checks]
kind = "node"
node = "checks"
port = "result"
[nodes.inputs.requirements]
kind = "input"
port = "requirements"
[nodes.inputs.source]
kind = "input"
port = "source"
[nodes.inputs.review]
kind = "node"
node = "reduce"
port = "result"
[nodes.inputs.testing]
kind = "node"
node = "correctness"
port = "testing"
[nodes.when]
node = "checks"
outcome = "passed"
