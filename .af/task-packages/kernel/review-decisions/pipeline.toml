schema = "af.pipeline/6"
name = "kernel/review-decisions"
version = "1.0.0"
max_attempts = 1
max_parallel = 1

[accepts]
kinds = ["review"]

[accepts.required_facts]

[slots]

[contract.inputs.original_result]
artifact_type = "af/TaskResult@1"
cardinality = "one"
optional = false
[contract.inputs.original_result.affinity]
kind = "unbound"

[contract.inputs.original_conclusion]
artifact_type = "af/TaskReviewConclusion@1"
cardinality = "one"
optional = false
[contract.inputs.original_conclusion.affinity]
kind = "unbound"

[contract.inputs.source]
artifact_type = "af/SourceTree@1"
cardinality = "one"
optional = false
[contract.inputs.source.affinity]
kind = "unbound"

[contract.inputs.base]
artifact_type = "af/SourceTree@1"
cardinality = "one"
optional = true
[contract.inputs.base.affinity]
kind = "unbound"

[contract.inputs.history]
artifact_type = "af/ReviewHistory@1"
cardinality = "one"
optional = false
[contract.inputs.history.affinity]
kind = "unbound"

[contract.inputs.decisions]
artifact_type = "af/ReviewDecisions@1"
cardinality = "one"
optional = false
[contract.inputs.decisions.affinity]
kind = "unbound"

[contract.outputs.review]
artifact_type = "af/TaskReviewRound@1"
cardinality = "one"
optional = false
covers = ["reviewed"]
[contract.outputs.review.affinity]
kind = "same_as"
input = "source"

[contract.outputs.history]
artifact_type = "af/ReviewHistory@1"
cardinality = "one"
optional = false
covers = []
[contract.outputs.history.affinity]
kind = "unbound"

[contract.outputs.findings]
artifact_type = "af/TaskReviewClaims@1"
cardinality = "one"
optional = false
covers = []
[contract.outputs.findings.affinity]
kind = "same_as"
input = "source"

[[nodes]]
id = "decide"
[nodes.operator]
op = "review_reduce"
[nodes.inputs.original_result]
kind = "input"
port = "original_result"
[nodes.inputs.original_conclusion]
kind = "input"
port = "original_conclusion"
[nodes.inputs.source]
kind = "input"
port = "source"
[nodes.inputs.base]
kind = "input"
port = "base"
[nodes.inputs.history]
kind = "input"
port = "history"
[nodes.inputs.decisions]
kind = "input"
port = "decisions"

[outputs.review]
kind = "node"
node = "decide"
port = "result"
[outputs.history]
kind = "node"
node = "decide"
port = "history"
[outputs.findings]
kind = "node"
node = "decide"
port = "findings"

[coverage.reviewed]
kind = "node"
node = "decide"
port = "result"
