schema = "af.worker/1"
name = "kernel/report-verifier"
version = "1.0.0"

[signature]
effects = ["read-source"]
roles = ["verify"]
worker_input_type = "af/ReportVerificationInput@1"
worker_output_type = "af/ReportEvaluation@1"
outcome_port = "result"

[signature.contract.inputs.checks]
artifact_type = "af/ReportCheckReceipt@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.inputs.checks.affinity]
kind = "same_as"
input = "source"

[signature.contract.inputs.comparison]
artifact_type = "af/MeasurementComparison@1"
cardinality = "one"
optional = true
covers = []

[signature.contract.inputs.comparison.affinity]
kind = "unbound"

[signature.contract.inputs.document]
artifact_type = "af/Document@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.inputs.document.affinity]
kind = "same_as"
input = "source"

[signature.contract.inputs.measurements]
artifact_type = "af/Measurement@1"
cardinality = "many"
optional = true
covers = []

[signature.contract.inputs.measurements.affinity]
kind = "unbound"

[signature.contract.inputs.requirements]
artifact_type = "af/Requirements@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.inputs.requirements.affinity]
kind = "unbound"

[signature.contract.inputs.source]
artifact_type = "af/SourceTree@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.inputs.source.affinity]
kind = "unbound"

[signature.contract.inputs.sources]
artifact_type = "af/ReportSources@1"
cardinality = "one"
optional = true
covers = []

[signature.contract.inputs.sources.affinity]
kind = "unbound"

[signature.contract.outputs.result]
artifact_type = "af/ReportEvaluation@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.outputs.result.affinity]
kind = "same_as"
input = "source"

[signature.evidence]

[signature.retains]
result = ["checks", "comparison", "document", "measurements", "requirements", "source", "sources"]

[signature.attempt]
tokens = 400000
wall_ms = 1800000

[runner]
kind = "model"
provider_kind = "codex"
model = "gpt-6-sol"
effort = "high"
