schema = "af.worker/1"
name = "kernel/gate-accept"
version = "1.0.0"

[signature]
effects = ["read-source"]
roles = ["evaluate"]
worker_input_type = "af/EvaluationInput@1"
worker_output_type = "af/TaskEvaluation@1"
outcome_port = "result"

[signature.contract.inputs.checks]
artifact_type = "af/TaskCheckReceipt@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.inputs.checks.affinity]
kind = "same_as"
input = "source"

[signature.contract.inputs.requirements]
artifact_type = "af/Requirements@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.inputs.requirements.affinity]
kind = "unbound"

[signature.contract.inputs.source]
artifact_type = "af/SourceTree@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.inputs.source.affinity]
kind = "unbound"

[signature.contract.outputs.result]
artifact_type = "af/TaskEvaluation@1"
cardinality = "one"
optional = false
covers = []

[signature.contract.outputs.result.affinity]
kind = "same_as"
input = "source"

[signature.evidence]

[signature.retains]
result = ["checks", "requirements", "source"]

[signature.attempt]
tokens = 0
wall_ms = 30000

[runner]
kind = "command"

[runner.command]
program = "/usr/bin/python3"

[[runner.command.args]]
value = "-B"
provenance = "literal"

[[runner.command.args]]
value = "@package/worker.py"
provenance = "literal"
