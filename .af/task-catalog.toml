schema = "af.task-catalog/2"
# Campaign catalog for the kernel's own campaigns. warm/* served the Worker warm layers plan;
# kernel/* is the generic family later plans use. Every package of a plan runs through one
# implementation-reviewed Pipeline with the same four native Workers. Provider labels here
# are neutral; a developer's local bindings file maps them to admitted machine-local accounts.
code_policy = ".af/code-policy.toml"
no_match = "refuse"

[review]
generation = 2
gate = "major"
clean_rounds = 1
max_rounds = 2
allow_targeted_repairs = false

[review.reviewers]
bugs = "required"
correctness = "required"
uix = "required"

