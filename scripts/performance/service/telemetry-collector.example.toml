# The trusted telemetry collector's configuration (af.perf-telemetry-collector/1, ADR-0200).
#
# An example for a future always-on Linux collection host; nothing installs it. Copy it outside
# the repository (the units below read /etc/af-perf-telemetry/collector.toml), set the paths and
# bounds, and run one cycle by hand first:
#
#   python3 -I -B scripts/performance/cli.py telemetry-collect --config collector.toml
#
# The token is a read-only token for the repository's contents and Actions artifacts. It is read
# only from the environment variable `token_env` names, only by the collector, and sent only to
# `api_url`. `authority_repository` is a mirror of the repository (`git clone --mirror`) the
# host keeps fetched: a result is kept only when the measurement authority it names is reachable
# from one of `trusted_refs` there, and that authority's files are read from its Git objects.
# This lane is separate from the archive collector (scripts/performance/collect.py), which stays
# pinned to the frozen hosted calibration cohort's control; neither reads the other's artifacts.

schema = "af.perf-telemetry-collector/1"
repository = "PakhomovAlexander/afactory"
workflow = "performance-telemetry.yml"
api_url = "https://api.github.com"
token_env = "AF_PERF_TELEMETRY_TOKEN"
root = "/var/lib/af-perf-telemetry/history"
authority_repository = "/var/lib/af-perf-telemetry/afactory.git"
trusted_refs = ["refs/heads/main"]
# Completed runs created within this many days are listed every cycle, oldest first, at most
# `runs_max` of them; a run whose result is kept is never downloaded again.
lookback_days = 13
collection_seconds = 1800
runs_max = 200
artifact_bytes_max = 268435456
# The durable root's bounds: bytes, results, and how long a result is kept.
bytes_max = 34359738368
results_max = 2048
retention_days = 365
